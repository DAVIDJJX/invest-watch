<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1420">
<meta name="robots" content="noindex">
<meta name="description" content="分析：總覽表、換匯助手、風險總表、相關矩陣、成本、拆解，以及只在瀏覽器裡算的集中度與私人倉庫的試算清單。">
<title>分析 — InvestWatch</title>
<link rel="stylesheet" href="css/style.css?v=20260930-8">
<style>
  /* 分析分頁自己的表格樣式（不動 css/style.css 既有的選擇器） */
  .ana-page h2 { margin-top: 28px; border-bottom: 1px solid var(--line); padding-bottom: 4px; font-size: 18px; }
  .ana-page h3 { font-size: 15px; margin-top: 18px; }
  .ana-page h4 { font-size: 13.5px; margin: 14px 0 4px; }
  .ana-page table { border-collapse: collapse; font-size: 12.5px; margin: 8px 0 14px; }
  .ana-page th, .ana-page td { border: 1px solid var(--line); padding: 4px 7px; text-align: left; vertical-align: top; }
  .ana-page th { background: var(--bg-soft); font-weight: 600; }
  .ana-page .warn { color: var(--error); font-weight: 600; }
  .ana-page .ok { color: var(--low); }
  .ana-page .muted { color: var(--text-faint); font-size: 11.5px; }
  .ana-page input[type=number], .ana-page input[type=text], .ana-page select { font-size: 13px; padding: 3px 5px; background: var(--bg-soft); color: var(--text); border: 1px solid var(--line); border-radius: 6px; }
  .ana-page button { font-size: 13px; padding: 5px 11px; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  .ana-page button:hover { background: var(--card-hover); }
  .ana-page details > summary { cursor: pointer; }
  .ana-page section { margin-bottom: 8px; }
  /* 風險總表：可排序的表頭 */
  .ana-page th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
  .ana-page th.sortable::after { content: ' ↕'; color: var(--text-faint); font-size: 10px; }
  .ana-page th.sortable.asc::after { content: ' ↑'; color: var(--text); }
  .ana-page th.sortable.desc::after { content: ' ↓'; color: var(--text); }
  .ana-page .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .ana-page .table-wrap table { min-width: 960px; }        /* 手機上整張橫向捲動，不要把 11 欄擠成一格一字 */
  /* 相關矩陣：數字是主要訊息，顏色只是輔助；手機上格子夠寬讓三位小數不換行、整張橫向捲動 */
  .ana-page .matrix-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .ana-page .matrix-wrap td, .ana-page .matrix-wrap th { min-width: 64px; white-space: nowrap; text-align: center; font-variant-numeric: tabular-nums; }
  .ana-page .matrix-wrap th:first-child, .ana-page .matrix-wrap td:first-child { text-align: left; position: sticky; left: 0; background: var(--bg); }
  .ana-page td.corr { color: var(--text); }
  .ana-page .matrix-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-faint); margin-top: -6px; }
  .ana-page .matrix-legend i { display: inline-block; width: 14px; height: 10px; border-radius: 2px; vertical-align: middle; margin-right: 4px; border: 1px solid var(--line); }
  /* 換匯助手（A1-6）：表格在手機上橫向捲動；「現在在這一檔」那一列加底色；圖示與白話的樣式在 css/style.css（全站共用） */
  .ana-page section#fx { scroll-margin-top: 96px; }          /* 從卡片的「換匯助手 →」跳進來時，標題不要被上面固定的頁首蓋住 */
  .ana-page .fx-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .ana-page table.fx-wide { min-width: 820px; }
  .ana-page table.fx-table td b { font-size: 14px; font-variant-numeric: tabular-nums; }
  .ana-page tr.fx-here td { background: var(--bg-soft); font-weight: 600; }
  .ana-page .fx-fixed-notes { font-size: 12px; color: var(--text-dim); padding-left: 18px; margin-top: 14px; }
  .ana-page #fxp-form input[type=text], .ana-page #fxp-form input[type=number] { width: 130px; }
  /* 總覽表（A1-7）：每個標的一列、每個面向一格。手機上整張橫向捲動、第一欄固定；點一列展開細節 */
  .ana-page section#overview h2 { margin-top: 14px; }
  .ana-page #ov-status p { margin: 6px 0 0; }
  .ana-page .ov-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 10px; }
  .ana-page table.ov-table { border-collapse: separate; border-spacing: 0; margin: 0; min-width: 660px; width: 100%; font-size: 13px; }
  .ana-page table.ov-table th, .ana-page table.ov-table td { border: 0; border-bottom: 1px solid var(--line); padding: 7px 10px; vertical-align: middle; }
  .ana-page table.ov-table th { white-space: nowrap; }
  .ana-page table.ov-table th.ov-name, .ana-page table.ov-table td.ov-name { position: sticky; left: 0; z-index: 1; background: var(--bg); min-width: 128px; max-width: 170px; }
  .ana-page table.ov-table th.ov-name { background: var(--bg-soft); }
  .ana-page table.ov-table td.date { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ana-page table.ov-table td.ov-asp { min-width: 112px; white-space: nowrap; }          /* 圖示與狀態詞不要被擠成兩行 */
  .ana-page table.ov-table td.ov-asp .asp-note { flex-basis: 100%; }                      /* 「累積中 n/20」自己一行 */
  .ana-page th.ov-sort { cursor: pointer; user-select: none; }
  .ana-page th.ov-sort::after { content: ' ↕'; color: var(--text-faint); font-size: 10px; }
  .ana-page th.ov-sort.asc::after { content: ' ↑'; color: var(--text); }
  .ana-page th.ov-sort.desc::after { content: ' ↓'; color: var(--text); }
  .ana-page tr.ov-row { cursor: pointer; }
  .ana-page tr.ov-row:hover td { background: var(--card-hover); }
  .ana-page tr.ov-row.is-open td { background: var(--card); }
  /* 列名與欄名是真的按鈕（鍵盤可以按），長相跟原本的字一樣 */
  .ana-page button.ov-toggle, .ana-page button.ov-sortbtn { font: inherit; font-weight: 700; color: inherit; background: none; border: 0; border-radius: 0; padding: 0; text-align: left; cursor: pointer; }
  .ana-page button.ov-toggle:hover, .ana-page button.ov-sortbtn:hover { background: none; color: var(--accent); }
  .ana-page tr.ov-detail > td { background: var(--bg); padding: 4px 12px 14px; }
  .ana-page .ov-detail-grid { position: sticky; left: 12px; display: grid; grid-template-columns: 1fr; gap: 0 10px; }
  @media (min-width: 900px) { .ana-page .ov-detail-grid { grid-template-columns: repeat(3, 1fr); align-items: start; } }
  /* 相關矩陣下面「每個標的一句」 */
  .ana-page ul.plain-list { list-style: none; padding-left: 0; margin: 6px 0 14px; font-size: 12.5px; }
  .ana-page ul.plain-list li { padding: 5px 0; border-bottom: 1px dashed var(--line); }
</style>
</head>

      <h1>Invest<span class="brand-dot">Watch</span></h1>

  </div>
</header>

<main class="wrap">
  <p class="muted">每一格數字旁邊都有資料日期與資料標籤（估算／單一來源／有對照／多來源一致）；方法與定義見 <a href="docs/ANALYSIS.md">docs/ANALYSIS.md</a>。這一頁只列事實，不做任何加總或判斷。</p>
  <section id="overview"></section>
  <section id="status"></section>
  <section id="fx"></section>
  <section id="risk"></section>
  <section id="cost"></section>
  <section id="decompose"></section>
  <section id="concentration"></section>
  <section id="adhoc">
    <h2>試算（A1-3）</h2>
    <p class="muted">臨時分析不在清單上的標的；結果只放在你的私人倉庫。這一段由分析頁的程式畫出「讀取」按鈕，要先在設定頁開啟雲端同步。</p>
  </section>
  <footer class="site-foot">
    <span>以上為量化整理，未經回測驗證，不構成投資建議。</span>
    <span>資料標籤：估算／單一來源／有對照／多來源一致；所有日期都是來源自己的時間戳。</span>
    <span>方法與定義：<a href="docs/ANALYSIS.md">docs/ANALYSIS.md</a></span>
  </footer>
</main>
