name: 更新市場資料

# ──────────────────────────────────────────────────────────────────────────
# 時段由【觸發者】告知，workflow 不猜。
#
# 正式的排程在 cron-job.org（外部、準時），它用 workflow_dispatch API 打進來，
# 並用 inputs.mode / inputs.slot 直接說「這一次是什麼」：
#   平日 08:10～17:40 每 30 分         mode=light  slot=light      只更新現價
#   09:30  mode=full  slot=morning     晨報「了解今天狀況」
#   11:30  mode=full  slot=midmorning  午前「盤中整理」
#   13:35  mode=full  slot=close       收盤「台股收盤快報」（13:30 收盤、晚 5 分才拿得到真正收盤價）
#   15:30  mode=full  slot=review      盤後「檢討與分析」
#   週末 08:10～20:10 每 2 小時         mode=light  slot=light
# 時間表的唯一真相來源是 data/schedule.json；cron-job.org 的設定方式見 docs/scheduler-setup.md。
#
# 下面那一行 GitHub 自己的 cron 只是【備援】。量過它從來不準時（晚 2～5 小時、
# 還會漏跑），所以備援只做 light 的資料更新、永遠不產報告——不管它幾點才觸發，
# 都不會產生一份時間標籤錯的報告。cron-job.org 掛掉時資料靠它撐著，
# 報告缺席會被 freshness 與之後的 watchdog 抓到，那才是正確的補救。
# 41 分避開整點（GitHub 整點負載最重，會直接丟掉工作）。
# ──────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "light=只更新現價；full=完整資料＋報告"
        required: true
        type: choice
        options: [light, full]
      slot:
        description: "時段標籤。light 只能配 mode=light；其餘只能配 mode=full"
        required: true
        type: choice
        options: [light, morning, midmorning, close, review, manual]
  schedule:
    - cron: "41 */3 * * *"      # 備援：每 3 小時一次 light，永遠不產報告

# 同一時間只跑一份，後到的排隊不取消——兩個 dispatch 相隔幾秒也都會完成
concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write
  actions: read        # 讀這一次 run 的 created_at，算「dispatch → 開跑」延遲

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 取出倉庫
        uses: actions/checkout@v4

      - name: 安裝 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install requests

      # 第一步就把 mode / slot 定下來；組合不合法直接結束碼 2，後面什麼都不跑。
      # 排程觸發（備援）一律 light/light。
      - name: 決定模式與時段（不猜，由觸發者告知）
        id: args
        run: |
          python scripts/dispatch_args.py \
            --event "${{ github.event_name }}" \
            --mode  "${{ github.event.inputs.mode }}" \
            --slot  "${{ github.event.inputs.slot }}" | tee -a "$GITHUB_OUTPUT"
          echo "本次：mode=${{ github.event.inputs.mode || 'light' }} / slot=${{ github.event.inputs.slot || 'light' }}（${{ github.event_name }}）"

      # dispatch 送出到真的開跑之間的延遲。7-I 若失敗，靠這個分清楚是排程沒發、
      # 還是 GitHub 排隊太久。
      - name: 記錄 dispatch → 開跑 的延遲
        id: latency
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CREATED=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .created_at)
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LAT=$(( $(date -u -d "$NOW" +%s) - $(date -u -d "$CREATED" +%s) ))
          echo "seconds=$LAT" >> "$GITHUB_OUTPUT"
          echo "dispatch 於 $CREATED，開跑於 $NOW，延遲 ${LAT} 秒（台北 $(TZ=Asia/Taipei date +%H:%M:%S) 開跑）"

      # --- 步驟 1：只抓雲端負責的 8 項 ------------------------------------
      # 結束碼：0 全部成功；2 部分失敗（分片已寫出、已標示，不紅燈）；其他＝程式壞掉，紅燈。
      - name: 抓取行情資料（雲端負責的 8 項）
        run: |
          MODE="${{ steps.args.outputs.mode }}"
          SLOT="${{ steps.args.outputs.slot }}"
          LIGHT=""; [ "$MODE" = "light" ] && LIGHT="--light"
          set +e
          python scripts/fetch_data.py --source cloud --slot "$SLOT" $LIGHT
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "部分標的失敗（結束碼 2）；分片已寫出、失敗已標示，繼續合併。"
          elif [ "$rc" -ne 0 ]; then
            echo "::error::抓取腳本壞掉（結束碼 $rc）"
            exit "$rc"
          fi

      # --- 步驟 2：把兩邊的分片合成 latest.json -------------------------
      - name: 合併成 latest.json
        run: python scripts/merge_latest.py

      # --- 步驟 3：產報告（只有 mode=full；light 與備援絕不產報告）------------
      # report.py 讀的是上一步剛合出來的 latest.json，順序不能顛倒。
      # 任何例外都直接讓這一步紅燈，不接、不吞。
      - name: 產生時段報告
        if: steps.args.outputs.mode == 'full'
        run: python scripts/report.py --slot "${{ steps.args.outputs.slot }}"

      - name: 把這次的結果寫進執行摘要
        if: always()
        continue-on-error: true
        env:
          MODE: ${{ steps.args.outputs.mode }}
          SLOT: ${{ steps.args.outputs.slot }}
          LATENCY: ${{ steps.latency.outputs.seconds }}
          EVENT: ${{ github.event_name }}
        run: |
          {
            echo "### 本次更新結果"
            echo ""
            echo "- 觸發：\`$EVENT\`　模式：\`$MODE\`　時段：\`$SLOT\`　dispatch→開跑延遲：${LATENCY:-—} 秒"
            python - <<'PY'
          import json
          d = json.load(open("data/latest.json", encoding="utf-8"))
          s = d["summary"]
          print(f"- 台北時間：**{d['updatedAtText']}**")
          print(f"- 時段標籤（來自雲端分片）：**{d['slotLabel']}**")
          print(f"- 成功 {s['ok']} 項 / 失敗 {s['error']} 項（共 {s['total']} 項）")
          print("")
          for name, info in (d.get("sources") or {}).items():
              age = info.get("ageMinutes")
              age = "—" if age is None else f"{age} 分鐘前"
              print(f"- 來源 `{name}`：{info.get('status')}，"
                    f"成功 {info.get('ok')} / 失敗 {info.get('error')}，資料是 {age}")
          print("")
          print("| 標的 | 狀態 | 新舊 | 價格 |")
          print("|---|---|---|---|")
          for a in d["assets"].values():
              price = a.get("price")
              price = "—" if price is None else f"{price:,}"
              mark = "OK" if a.get("status") == "ok" else "更新失敗"
              print(f"| {a['name']} | {mark} | {a.get('freshness')} | {price} |")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      # --- 步驟 4：提交並推上來 -------------------------------------------
      # 競態處理全部在 scripts/publish.py（雲端和家用電腦共用）。
      # light 只重跑 merge；full 重跑 merge + 這一輪的報告。
      - name: 有變動就存檔並推上來
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MODE="${{ steps.args.outputs.mode }}"
          SLOT="${{ steps.args.outputs.slot }}"
          DATE=$(TZ=Asia/Taipei date +%Y-%m-%d)
          TIME=$(TZ=Asia/Taipei date +%H:%M)
          if [ "$MODE" = "full" ]; then
            REBUILD="merge,report:$SLOT"
            MSG="data: $DATE $SLOT 更新（雲端，$TIME）"
          else
            REBUILD="merge"
            MSG="data: $DATE $TIME 盤中更新（雲端）"
          fi
          python scripts/publish.py --source cloud --rebuild "$REBUILD" --message "$MSG"
