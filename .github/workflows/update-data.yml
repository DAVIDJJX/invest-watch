name: 更新市場資料

# GitHub 的排程用的是 UTC 時間，台北時間要減 8 小時：
#   台北 10:17 -> UTC 02:17   （晨報 morning）
#   台北 13:17 -> UTC 05:17   （午盤 midday）
#   台北 15:17 -> UTC 07:17   （收盤 close）
#
# 為什麼是 17 分而不是整點？2026-09-01 實測：原本設整點，當天三次排程
# 只有一次真的觸發。GitHub 的免費排程在整點負載最重，會直接把工作丟掉，
# 官方也建議避開整點。改成 17 分可以明顯提高觸發率。
# 另外排程本來就可能延遲 5～15 分鐘，屬正常現象。
on:
  schedule:
    - cron: "17 2,5,7 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "要記成哪個時段"
        required: false
        default: "manual"
        type: choice
        options:
          - manual
          - morning
          - midday
          - close

# 同一時間只跑一份，避免兩次執行互相蓋掉對方的 commit
concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 取出倉庫
        uses: actions/checkout@v4

      - name: 安裝 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install requests

      - name: 決定這次的時段名稱
        id: slot
        run: |
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            SLOT="${{ github.event.inputs.slot }}"
          else
            # 依 UTC 小時判斷；排程延遲一兩個小時也還是對得上
            H=$(date -u +%H)
            H=$((10#$H))
            if   [ "$H" -ge 1 ] && [ "$H" -le 3 ]; then SLOT=morning
            elif [ "$H" -ge 4 ] && [ "$H" -le 6 ]; then SLOT=midday
            elif [ "$H" -ge 7 ] && [ "$H" -le 9 ]; then SLOT=close
            else SLOT=manual
            fi
          fi
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "本次時段：$SLOT"

      # --- 步驟 1：只抓雲端負責的 8 項 -----------------------------------
      # --source cloud 一定要帶。台銀那 5 項（黃金存摺、實體金條塊、兩個匯率）
      # 的網站會擋掉資料中心 IP，雲端抓不到；而且雲端一旦去抓，就會寫出
      # data/sources/local.json 把家用電腦抓到的資料蓋成「更新失敗」——
      # 2026-09-03 20:07 就是這樣把 20:00 剛抓到的黃金價格洗掉的。
      # fetch_data.py 的 --source 已經改成必填，忘了帶會直接報錯，不會安靜地做錯事。
      - name: 抓取行情資料（雲端負責的 8 項）
        run: python scripts/fetch_data.py --source cloud --slot "${{ steps.slot.outputs.slot }}"

      # --- 步驟 2：把兩邊的分片合成 latest.json ---------------------------
      # fetch_data.py 現在只寫自己的分片，不寫 latest.json。
      # 這一步把 data/sources/cloud.json 與 data/sources/local.json
      #（家用電腦上次推上來的）合成前端要看的 data/latest.json。
      # 分片壞掉或不見時這支照樣會產出檔案並回 0，只在輸出印 ::warning::。
      - name: 合併成 latest.json
        run: python scripts/merge_latest.py

      # --- 步驟 3：產生這個時段的報告 -------------------------------------
      # 報告只有雲端會產（家用電腦不產）。report.py 讀的是上一步剛合出來的
      # latest.json，所以順序不能顛倒。
      - name: 產生時段報告
        run: python scripts/report.py --slot "${{ steps.slot.outputs.slot }}"

      # 摘要一定要排在合併之後：它讀的是 data/latest.json，
      # 而那個檔案現在是第 2 步才產生的。
      - name: 把這次的結果寫進執行摘要
        if: always()
        continue-on-error: true
        run: |
          {
            echo "### 本次更新結果"
            echo ""
            python - <<'PY'
          import json
          d = json.load(open("data/latest.json", encoding="utf-8"))
          s = d["summary"]
          print(f"- 台北時間：**{d['updatedAtText']}**")
          print(f"- 時段：**{d['slotLabel']}**")
          print(f"- 成功 {s['ok']} 項 / 失敗 {s['error']} 項（共 {s['total']} 項）")
          print("")
          for name, info in (d.get("sources") or {}).items():
              age = info.get("ageMinutes")
              age = "—" if age is None else f"{age} 分鐘前"
              print(f"- 來源 `{name}`：{info.get('status')}，"
                    f"成功 {info.get('ok')} / 失敗 {info.get('error')}，資料是 {age}")
          print("")
          print("| 標的 | 狀態 | 新舊 | 價格 |")
          print("|---|---|---|---|")
          for a in d["assets"].values():
              price = a.get("price")
              price = "—" if price is None else f"{price:,}"
              mark = "OK" if a.get("status") == "ok" else "更新失敗"
              print(f"| {a['name']} | {mark} | {a.get('freshness')} | {price} |")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      # --- 步驟 4：提交並推上來 -------------------------------------------
      # 競態處理全部在 scripts/publish.py 裡（雲端和家用電腦共用同一份）。
      # 推不上去時它會：保留自己這一輪產生的檔案 → 索引與 data/ 工作區
      # 整個回到遠端狀態（拿到對方剛推上來的分片）→ 把自己的放回去 →
      # 重跑 merge 與 report → 重新 commit → 再推。最多 3 次。
      # 這樣才不會像舊做法那樣用 reset --soft 把對方剛推上去的資料還原掉。
      - name: 有變動就存檔並推上來
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DATE=$(TZ=Asia/Taipei date +%Y-%m-%d)
          SLOT="${{ steps.slot.outputs.slot }}"
          python scripts/publish.py \
            --source cloud \
            --rebuild "merge,report:$SLOT" \
            --message "data: $DATE $SLOT 更新（雲端）"
