name: 更新市場資料

# GitHub 的排程用的是 UTC 時間，台北時間要減 8 小時：
#   台北 10:17 -> UTC 02:17   （晨報 morning）
#   台北 13:17 -> UTC 05:17   （午盤 midday）
#   台北 15:17 -> UTC 07:17   （收盤 close）
#
# 為什麼是 17 分而不是整點？2026-09-01 實測：原本設整點，當天三次排程
# 只有一次真的觸發。GitHub 的免費排程在整點負載最重，會直接把工作丟掉，
# 官方也建議避開整點。改成 17 分可以明顯提高觸發率。
# 另外排程本來就可能延遲 5～15 分鐘，屬正常現象。
on:
  schedule:
    - cron: "17 2,5,7 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "要記成哪個時段"
        required: false
        default: "manual"
        type: choice
        options:
          - manual
          - morning
          - midday
          - close

# 同一時間只跑一份，避免兩次執行互相蓋掉對方的 commit
concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 取出倉庫
        uses: actions/checkout@v4

      - name: 安裝 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install requests

      - name: 決定這次的時段名稱
        id: slot
        run: |
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            SLOT="${{ github.event.inputs.slot }}"
          else
            # 依 UTC 小時判斷；排程延遲一兩個小時也還是對得上
            H=$(date -u +%H)
            H=$((10#$H))
            if   [ "$H" -ge 1 ] && [ "$H" -le 3 ]; then SLOT=morning
            elif [ "$H" -ge 4 ] && [ "$H" -le 6 ]; then SLOT=midday
            elif [ "$H" -ge 7 ] && [ "$H" -le 9 ]; then SLOT=close
            else SLOT=manual
            fi
          fi
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "本次時段：$SLOT"

      - name: 抓取行情資料
        run: python scripts/fetch_data.py --slot "${{ steps.slot.outputs.slot }}"

      - name: 把抓到的結果寫進執行摘要
        if: always()
        continue-on-error: true
        run: |
          {
            echo "### 本次更新結果"
            echo ""
            python - <<'PY'
          import json
          d = json.load(open("data/latest.json", encoding="utf-8"))
          s = d["summary"]
          print(f"- 台北時間：**{d['updatedAtText']}**")
          print(f"- 時段：**{d['slotLabel']}**")
          print(f"- 成功 {s['ok']} 項 / 失敗 {s['error']} 項（共 {s['total']} 項）")
          print("")
          print("| 標的 | 狀態 | 價格 |")
          print("|---|---|---|")
          for a in d["assets"].values():
              price = a.get("price")
              price = "—" if price is None else f"{price:,}"
              mark = "OK" if a.get("status") == "ok" else "更新失敗"
              print(f"| {a['name']} | {mark} | {price} |")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 有變動就存檔並推上來
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "資料沒有變動，這次不用 commit。"
            exit 0
          fi
          DATE=$(TZ=Asia/Taipei date +%Y-%m-%d)
          MSG="data: $DATE ${{ steps.slot.outputs.slot }} 更新"
          git commit -m "$MSG"

          # 推不上去＝這期間有別的 commit 進來。這時「絕對不要」用 merge/rebase 去
          # 逐行合併 data/ 的 JSON——那會產生自相矛盾的檔案（summary 說失敗、
          # 各標的卻是成功）。正確做法是：把 HEAD 移到最新的遠端，工作區保持
          # 這次剛抓到的檔案，再重新 commit 一次。
          for i in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "推送成功。"
              exit 0
            fi
            echo "遠端有新的 commit，改以這次抓到的資料重新提交（第 $i 次）"
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --soft "origin/${GITHUB_REF_NAME}"
            git add data/
            if git diff --cached --quiet; then
              echo "和遠端內容一樣，不用再 commit。"
              exit 0
            fi
            git commit -m "$MSG"
          done
          echo "連續三次都推不上去，這次先跳過（下一個時段會再更新）。"
          exit 1
