<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1f5f8">
<script>/* U1：畫面畫出來之前套上主題（localStorage 的 iw-theme，dark＝深色，其他或讀不到＝淺色）；別的分頁換了主題，這一頁跟著換並發 iw:theme 讓圖表重畫 */
(function () {
  var KEY = 'iw-theme', root = document.documentElement;
  function apply(t) {
    if (t === 'dark') root.setAttribute('data-theme', 'dark'); else root.removeAttribute('data-theme');
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t === 'dark' ? '#0e1420' : '#f1f5f8');
  }
  var t = null;
  try { t = window.localStorage.getItem(KEY); } catch (e) { t = null; }
  apply(t);
  window.IwTheme = { KEY: KEY, apply: apply };   /* 設定頁的切換用同一份 */
  window.addEventListener('storage', function (e) {
    if (e.key !== KEY) return;
    apply(e.newValue);
    try { document.dispatchEvent(new Event('iw:theme')); } catch (x) { /* 舊瀏覽器沒有 Event 建構子：不重畫，重新整理就好 */ }
  });
}());
</script>
<meta name="description" content="每天 10:00 / 13:00 / 15:00 三份市場報告的歷史封存。">
<title>歷史報告 — InvestWatch</title>
<link rel="stylesheet" href="css/style.css?v=20261105-1">
</head>
<body>

<header class="site-head">
  <div class="wrap">
    <div class="brand">
      <h1>Invest<span class="brand-dot">Watch</span></h1>
      <span class="tagline">歷史報告封存</span>
    </div>
    <nav class="nav">
      <a href="index.html">儀表板</a>
      <a href="history.html" class="active">歷史</a>
      <a href="analysis.html">分析</a>
      <a href="records.html">我的紀錄</a>
      <a href="settings.html">設定</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="hist-layout">

    <aside class="hist-side">
      <div class="section-title">選日期</div>
      <div id="day-list" class="day-list">
        <div class="loading">載入中…</div>
      </div>
    </aside>

    <div class="hist-main">
      <div id="slot-tabs" class="slot-tabs"></div>
      <div id="report">
        <div class="loading">載入報告中…</div>
      </div>

      <details class="snap-box">
        <summary>當日各標的行情快照</summary>
        <div id="snapshot"><div class="loading">載入中…</div></div>
      </details>
    </div>

  </div>

  <footer class="site-foot">
    <span>報告由 scripts/report.py 依固定規則自動產生，每天封存進倉庫</span>
    <span>本站不儲存任何個人持倉資料</span>
  </footer>
</main>

<script src="js/report.js?v=20261105-1"></script>
<script src="js/history.js?v=20261105-1"></script>
</body>
</html>
