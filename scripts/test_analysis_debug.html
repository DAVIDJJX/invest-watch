<!DOCTYPE html>
<html lang="zh-Hant">

<body>
  <!-- 這一頁不連網、不讀資料檔：把假的 status／risk／decompose 塞進 js/analysis-debug.js 的 render()，
       再逐題檢查畫出來的東西，結果以 JSON 放在下面那個 id 叫 result 的區塊，給 test_analysis_debug_js.py 讀。 -->

  <section id="risk"></section>

  <footer><p>以上為量化整理，未經回測驗證，不構成投資建議。</p></footer>
  <pre id="result"></pre>
  <script src="../js/storage.js"></script>
  <script src="../js/concentration.js"></script>
  <script src="../js/analysis-debug.js"></script>
  <script>
    (function () {
      var FIX = {
        status: { generatedAt: '2026-09-24T15:35:10+08:00', lastRun: '2026-09-24T15:35:10+08:00', slot: 'review', mode: 'live',
                  ok: false, errors: ['拆解（黃金）：沒有 gold_intl 的日線歷史'], warnings: [], produced: ['data/analysis/risk.json'], requests: 10,

                                 fx_usd: { points: 1080, lastDate: '2026-09-18', action: 'full：抓到 1080 週' } } },
        risk: { generatedAt: '2026-09-24T15:35:12+08:00', notes: ['測試用'],

                          volatility: { '1y': { pct: 12.34, weeks: 52, window: '52 週', from: '2025-09-15', through: '2026-09-14', label: '單一來源' },

                          volatility: { '1y': { pct: 15.1, weeks: 52, window: '52 週', from: '2025-09-15', through: '2026-09-14', label: '單一來源' },
                                        '5y': { pct: null, weeks: 40, window: '260 週', reason: '資料不足：只有 40 週（至少要 234 週）' } },
                          maxDrawdown: { pct: -48.9, peakDate: '2020-03-09', troughDate: '2023-10-23', recoveredDate: null, label: '單一來源' },

                problems: [] },

                     gold: { formula: '台銀黃金存摺的本行賣出價 ≈ 國際金價 × USD/TWD ÷ 31.1035 ＋ 殘差', label: '估算', notes: ['近月期貨'],
                             live: { label: '估算', goldSell: 4415, goldDate: '2026-09-24', gcPrice: 4211.5, gcDate: '2026-09-24', fxMid: 31.65, fxDate: '2026-09-23', implied: 4285.32, residualPct: 3.026, gcNote: '盤中價' },
                             summarySameDay: { n: 60, window: '最近 60 個有資料的日子', from: '2026-06-20', through: '2026-09-23', medianPct: 2.9, meanPct: 2.95, minPct: 2.1, maxPct: 3.8 },
                             summaryPrevDay: { n: 0, reason: '資料不足' },
                             daily: [ { d: '2026-09-22', goldSell: 4350, gc: 4100, impliedSameDay: 4152.3, residualSameDayPct: 4.76, gcPrev: 4000, gcPrevDate: '2026-09-21', impliedPrevDay: 4051.0, residualPrevDayPct: 7.38, fxMid: 31.5, fxDate: '2026-09-22' },
                                      { d: '2026-09-23', goldSell: 4360, gcPrev: 4100, gcPrevDate: '2026-09-22', impliedPrevDay: 4160.0, residualPrevDayPct: 4.81, fxMid: 31.6, fxDate: '2026-09-23' } ] },
                     tw00646: { formula: '00646 月報酬 ≈ (1＋S&P 500 月報酬)(1＋USD/TWD 月變動) − 1 ＋ 殘差', label: '估算', notes: ['價格指數'],
                                summaryLast12: { months: 12, from: '2025-09', through: '2026-08', residualSumPct: 1.1, residualMeanPct: 0.09, residualStdPct: 0.6 },
                                summaryAll: { months: 128, from: '2016-01', through: '2026-08', residualSumPct: 12.3, residualMeanPct: 0.1, residualStdPct: 0.7 },
                                monthly: [ { month: '2026-07', d646: '2026-07-27', r646Pct: 3.1, dGspc: '2026-07-27', rGspcPct: 2.5, dFx: '2026-07-31', rFxPct: 0.4, combinedPct: 2.91, residualPct: 0.19 },
                                           { month: '2026-08', d646: '2026-08-31', r646Pct: -1.0, dGspc: '2026-08-31', rGspcPct: -0.8, dFx: '2026-08-28', rFxPct: -0.3, combinedPct: -1.098, residualPct: 0.098 } ] } }
      };
      FIX.cost = { generatedAt: '2026-09-24T15:35:14+08:00', notes: ['測試用'],
        trackingDifference: {
          primary: { benchmark: '^SP500TR', available: true, label: '估算', notes: ['含股息再投資的基準'],
                     windows: { '1y': { weeks: 52, from: '2025-09-15', through: '2026-09-14', r646Pct: 14.1, rBenchTwdPct: 15.6, diffPct: -1.5, annualizedDiffPct: -1.5 },
                                '3y': { weeks: 156, from: '2023-09-18', through: '2026-09-14', r646Pct: 60.2, rBenchTwdPct: 65.0, diffPct: -4.8, annualizedDiffPct: -1.0 } } },
          reference: { benchmark: '^GSPC', available: false, reason: '資料不足（測試）', label: '估算' } },
        premium: { tw00646: { status: '未接（來源在雲端被擋）', label: '估算', reason: 'N-04 在 runner 上回 502' },
                   tw00679b: { status: '僅 30 日', label: '單一來源',
                               latest: [ { d: '2026-09-23', price: 25.69, nav: 25.7842, premiumPct: -0.37, tag: '確定' } ],
                               short: { title: '櫃買 30 日', n: 30, from: '2026-08-11', through: '2026-09-23', medianPct: -0.44, minPct: -1.1, maxPct: 0.2 } } },
        goldSpread: { label: '單一來源', latest: { d: '2026-09-24', buy: 4330, sell: 4382, spreadPct: 1.194 },
                      summary: { n: 261, from: '2025-09-01', through: '2026-09-24', medianPct: 1.19, minPct: 1.05, maxPct: 1.35 } },
        barPremium: { label: '單一來源', n: 12, from: '2026-08-31', notes: ['條塊只有 12 天'],
                      latest: { d: '2026-09-24', goldSell: 4382, rows: [ { spec: '1 公斤', grams: 1000, price: 4441200, perGram: 4441.2, premiumPct: 1.35 },
                                                                          { spec: '100 公克', grams: 100, price: 447022, perGram: 4470.2, premiumPct: 2.01 } ] } } };
      FIX.staticCosts = { note: '每筆帶官方出處與查核日期', entries: [
        { asset: 'tw00646', item: '經理費', value: '0.30', unit: '%／年', label: '官方公告', source: 'https://example.invalid/00646', sourceTitle: '測試出處', checkedOn: '2026-09-25', note: '' },
        { asset: 'tw00679b', item: '總費用率（最近一年）', value: null, nullReason: '測試：沒有查到', label: '官方公告', source: '', checkedOn: '2026-09-25', note: '' } ] };
      // 假的設定檔：權重一看就是假的（10／20／30 遞增），代理標的台積電
      // 假的設定檔用 fromForm 組（設定檔的鍵名只准在 concentration.js 裡出現）
      var FAKE_PROFILE = Concentration.fromForm({ stock: '10', index_etf: '20', bond_etf: '30', commodity: '15', crypto: '5', fx: '5', gold_tw: '10', other: '5', proxy: 'tw2330', month: '2026-09' });
      var CORR = { ids: ['tw2330', 'tw00646', 'tw00679b', 'gold_intl', 'btc', 'fx_usd'], matrix: {
        tw2330: { tw2330: { r: 1, n: 156 }, tw00646: { r: 0.51, n: 156 }, tw00679b: { r: 0.03, n: 156 }, gold_intl: { r: 0.11, n: 156 }, btc: { r: 0.10, n: 156 }, fx_usd: { r: -0.32, n: 154 } },
        tw00646: { tw2330: { r: 0.51, n: 156 } }, tw00679b: { tw2330: { r: 0.03, n: 156 } }, gold_intl: { tw2330: { r: 0.11, n: 156 } }, btc: { tw2330: { r: 0.10, n: 156 } }, fx_usd: { tw2330: { r: -0.32, n: 154 } } } };
      FIX.risk.correlation.ids = FIX.risk.correlation.ids.concat(CORR.ids); FIX.risk.correlation.matrix = Object.assign(FIX.risk.correlation.matrix, CORR.matrix);
      var results = [];
      function check(name, fn) {
        var problems = [];
        try { fn(problems); } catch (e) { problems.push('例外：' + (e && e.message)); }
        results.push({ name: name, ok: problems.length === 0, problems: problems });
      }
      var loaded = !!(window.AnalysisDebug && window.AnalysisDebug.render && window.Concentration && window.Storage);
      if (loaded) {
        var facts = Concentration.facts(FAKE_PROFILE, FIX.risk.correlation);
        FIX.concentration = { status: 'set', facts: facts, formValues: Concentration.toFormValues(FAKE_PROFILE), canEdit: true };
        AnalysisDebug.render(FIX);
        var $ = function (sel) { return document.querySelector(sel); };
        var $$ = function (sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); };
        var text = document.body.innerText || document.body.textContent;

        check('status_shows_last_run_and_errors_on_top', function (p) {
          var s = $('#status');
          if (!s || s.innerText.indexOf('2026-09-24T15:35:10+08:00') < 0) p.push('沒有顯示上次執行時間');
          if (!$('#status .warn')) p.push('有錯卻沒有紅字');
          if (s.innerText.indexOf('沒有 gold_intl 的日線歷史') < 0) p.push('沒有列出錯誤內容');
          if (s.innerText.indexOf('history-long') < 0) p.push('沒有列長歷史表');
        });
        check('risk_table_has_one_row_per_asset', function (p) {
          var rows = $$('#risk table')[0] ? $$('#risk table')[0].querySelectorAll('tbody tr').length : 0;
          if (rows !== 2) p.push('風險表列數 ' + rows + '，應為 2');
          if ($('#risk').innerText.indexOf('12.34%') < 0) p.push('沒有 1 年波動');
          if ($('#risk').innerText.indexOf('資料不足') < 0) p.push('資料不足沒有顯示');
          if ($('#risk').innerText.indexOf('2027-01') < 0) p.push('10 年視窗的說明沒顯示');
        });
        check('correlation_matrix_rendered', function (p) {
          var t = $$('#risk table')[1];
          if (!t) { p.push('沒有相關矩陣表'); return; }
          if (t.innerText.indexOf('1.000') < 0) p.push('對角線沒有 1.000');
          if (t.innerText.indexOf('-0.123') < 0) p.push('相關值沒顯示');
          if (t.innerText.indexOf('資料不足') < 0) p.push('資料不足的格沒顯示');
        });
        check('every_date_cell_is_non_empty_and_looks_like_a_date', function (p) {
          var cells = $$('.date');
          if (cells.length < 20) p.push('日期欄太少：' + cells.length);
          cells.forEach(function (c) {
            var v = (c.innerText || '').trim();
            if (!/^(\d{4}-\d{2}-\d{2}|\d{4}-W\d{2}|\d{4}-\d{2})/.test(v)) p.push('日期欄不是日期：「' + v + '」');
          });
        });
        check('decompose_rendered_with_live_row_and_monthly_rows', function (p) {
          var d = $('#decompose').innerText;
          if (d.indexOf('31.1035') < 0) p.push('公式沒顯示');
          if (d.indexOf('3.03%') < 0 && d.indexOf('3.026') < 0) p.push('現在這一刻的殘差沒顯示');
          if (d.indexOf('2026-07') < 0) p.push('月拆解沒顯示');
          if (d.indexOf('估算') < 0) p.push('資料標籤沒顯示');
          if (d.indexOf('資料不足') < 0) p.push('前一日口徑的資料不足沒顯示');
        });
        check('no_judgement_words_on_the_page', function (p) {
          var exempt = ['不構成投資建議', '本行賣出', '本行買入', '即期賣出', '即期買入', '現金賣出', '現金買入', '掛牌賣出'];
          var t = text;
          exempt.forEach(function (e) { t = t.split(e).join(''); });
          ['買' + '進', '賣' + '出', '建' + '議', '總' + '分', '分' + '數'].forEach(function (w) {
            if (t.indexOf(w) >= 0) p.push('頁面上出現「' + w + '」');
          });
        });
        check('cost_section_rendered', function (p) {
          var t = $('#cost').innerText;
          if (t.indexOf('^SP500TR') < 0) p.push('主口徑沒顯示');
          if (t.indexOf('-1.50%') < 0 && t.indexOf('−1.50%') < 0) p.push('1 年追蹤差沒顯示');
          if (t.indexOf('未接（來源在雲端被擋）') < 0) p.push('未接狀態沒顯示');
          if (t.indexOf('僅 30 日') < 0) p.push('僅 30 日沒顯示');
          if (t.indexOf('1.19%') < 0) p.push('黃金價差沒顯示');
          if (t.indexOf('1.35%') < 0) p.push('條塊溢價沒顯示');
          if (t.indexOf('null（測試：沒有查到）') < 0) p.push('靜態成本的 null 沒有寫原因');
          if (t.indexOf('2026-09-25') < 0) p.push('查核日期沒顯示');
        });
        check('concentration_three_facts_with_fake_profile', function (p) {
          var t = $('#concentration').innerText;
          if (!facts.ok) { p.push('facts 沒算出來'); return; }
          if (facts.maxClass.pct !== 30) p.push('最大單一類別應為 30，得到 ' + facts.maxClass.pct);
          if (facts.topTwo.pct !== 50) p.push('前二合計應為 50，得到 ' + facts.topTwo.pct);
          if (facts.aligned.pct !== 30) p.push('同向合計應為 30（個股 10＋指數 ETF 20），得到 ' + facts.aligned.pct);
          if (t.indexOf('30.00%') < 0 || t.indexOf('50.00%') < 0) p.push('三個事實沒顯示在頁面上');
          if (facts.aligned.rows.some(function (r) { return r.cls === 'other'; })) p.push('other 不該出現在同向列表');
          if (facts.aligned.otherExcluded !== true) p.push('有 other 權重時 otherExcluded 應為 true');
          if (t.indexOf('0.510') < 0) p.push('相關係數本身沒顯示');
          if (t.indexOf('未納入同向計算') < 0) p.push('other 排除同向的註記沒顯示');
          if (!$('#w_stock') || !$('#proxy_sel') || !$('#profile-save')) p.push('表單沒畫出來');
          if ($('#w_bond_etf').value !== '30') p.push('表單沒有帶入設定值');
        });
        check('concentration_unset_state', function (p) {
          var box = document.createElement('div');
          box.innerHTML = AnalysisDebug.renderConcentration({ status: 'unset', reason: '私人倉庫裡還沒有設定檔' });
          if (box.innerText.indexOf('未設定') < 0) p.push('沒有顯示未設定');
          if (box.querySelector('#profile-form')) p.push('未設定且不能編輯時不該有表單');
          var box2 = document.createElement('div');
          box2.innerHTML = AnalysisDebug.renderConcentration({ status: 'unset', reason: 'x', showForm: true, canEdit: true, formValues: Concentration.toFormValues(Concentration.emptyTemplate()) });
          if (!box2.querySelector('#profile-form')) p.push('可以編輯時應該顯示建立設定檔的表單');
        });
        check('validation_blocks_bad_numbers_and_only_warns_on_sum', function (p) {
          var bad = Concentration.validate(Concentration.fromForm({ stock: '-5', index_etf: 'abc', proxy: 'tw2330' }));
          if (bad.ok || bad.errors.length !== 2) p.push('負數與非數字應該各給一個錯誤');
          var low = Concentration.validate(Concentration.fromForm({ stock: '40', index_etf: '40', proxy: 'tw2330' }));
          if (!low.ok) p.push('總和 80 不該是錯誤');
          if (!low.warnings.some(function (w) { return w.indexOf('95') >= 0; })) p.push('總和不在 95～105 應該警告');
          var f = Concentration.fromForm({ stock: '10', index_etf: '20', bond_etf: '30', commodity: '15', crypto: '5', fx: '5', gold_tw: '10', other: '5', proxy: 'tw2330', month: '2026-09' });
          if (Concentration.facts(f, FIX.risk.correlation).topTwo.pct !== 50) p.push('fromForm → facts 不一致');
        });
        check('profile_key_names_never_reach_the_dom', function (p) {
          var html = document.documentElement.outerHTML.replace(/<script[\s\S]*?<\/script>/g, '');
          ['wei' + 'ghts', 'salaryProxy' + 'AssetId', 'as' + 'Of'].forEach(function (k) {
            if (html.indexOf(k) >= 0) p.push('渲染出來的 DOM 裡出現設定檔鍵名「' + k + '」');
          });
          if (html.indexOf('FAKE_PROFILE') >= 0) p.push('fixture 名稱洩進 DOM');
        });
        check('storage_exposes_loadFile_and_saveFile', function (p) {
          if (typeof Storage.loadFile !== 'function' || typeof Storage.saveFile !== 'function') p.push('storage.js 沒有 loadFile／saveFile');
          if (typeof Concentration.facts !== 'function' || Concentration.FILE !== 'analysis-profile.json') p.push('concentration.js 介面不對');
        });
        check('missing_status_is_loud', function (p) {
          var box = document.createElement('div');
          AnalysisDebug.render({ status: null, risk: null, decompose: null }, { status: box, risk: box, decompose: box });
          var box2 = document.createElement('div');
          box2.innerHTML = AnalysisDebug.renderStatus(null);
          if (!box2.querySelector('.warn') || box2.innerText.indexOf('讀不到') < 0) p.push('沒有 status 時沒有紅字說讀不到');
          var box3 = document.createElement('div');
          box3.innerHTML = AnalysisDebug.renderRisk(null);
          if (box3.innerText.indexOf('讀不到') < 0) p.push('沒有 risk 時沒有說讀不到');
        });
      }
      document.getElementById('result').textContent = JSON.stringify({
        loaded: loaded, total: results.length, results: results
      });
    })();
  </script>
</body>
</html>
