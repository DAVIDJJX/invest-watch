                       '最常跟它同方向走的是 S&P 500 指數（0.90）；走勢最沒有關係的是 tw00679b（0.05）；常常跟它反方向的是 美元 / 台幣（-0.35）。'],

                     [{ pct: -0.2, spec: '100 公克' }, '同樣重量的黃金，100 公克條塊比黃金存摺便宜 0.20%。'],

                   [{ pct: 0.11, kind: 'etf', lead: '平均每個月' }, '平均每個月：00646 的報酬比「指數 × 匯率」合起來算的多 0.11 個百分點；差在費用、股息與換匯的時間點。'],

                [{ total: -2, usdTwd: -1, usdCny: 1 }, '這段期間人民幣兌台幣跌了 2.00%：美元兌台幣跌了 1.00%，美元兌人民幣漲了 1.00%（人民幣對美元變便宜）。'],

                [{ total: 1 }, NA]],

              [{ pct: 0.3, kind: 'tax' }, '每 10,000 元的成交金額，這一項是 30 元。'],
              [{ pct: 0, kind: 'tax' }, '目前這一項是 0。'],
              [{ kind: 'tax' }, NA]],
        concMax: [[{ pct: 30, label: '債券 ETF' }, '放最多的一類是「債券 ETF」，佔全部的 30%。'],
                  [{ pct: 100, label: '個股' }, '放最多的一類是「個股」，佔全部的 100%。'],
                  [{ pct: 30 }, NA]],
        concTopTwo: [[{ pct: 50, labels: ['債券 ETF', '指數 ETF'] }, '最大的兩類（債券 ETF＋指數 ETF）合起來佔全部的 50%。'],
                     [{ pct: 100, labels: ['個股'] }, '最大的兩類（個股）合起來佔全部的 100%。'],
                     [{ pct: 50, labels: [] }, NA]],

                      [{ pct: 0, proxy: 'tw2330' }, '跟收入來源的代理標的（tw2330）常常同方向走的類別，合起來佔全部的 0%。'],
                      [{ pct: 30 }, NA]]
      };

      if (loaded) {
        var P = window.Plain, G = window.Glossary, I = window.Indicators;
        function lamp(pct) { return I.positionSignal({ percentile: pct, days: 252, full: true }); }

        check('three_states_follow_the_printed_rules', function (p) {
          same(p, '5 年百分位 39.9', P.fxPositionState(39.9).word, '偏便宜');
          same(p, '5 年百分位 40', P.fxPositionState(40).word, '中間');
          same(p, '5 年百分位 60', P.fxPositionState(60).word, '中間');
          same(p, '5 年百分位 60.1', P.fxPositionState(60.1).word, '偏貴');
          same(p, '成本 0.89 倍', P.costState(0.89, 1).word, '便宜');
          same(p, '成本 0.9 倍', P.costState(0.9, 1).word, '正常');
          same(p, '成本 1.1 倍', P.costState(1.1, 1).word, '正常');
          same(p, '成本 1.11 倍', P.costState(1.11, 1).word, '偏貴');
          same(p, '風險 0.79 倍', P.riskState(7.9, 10).word, '平靜');
          same(p, '風險 1 倍', P.riskState(10, 10).word, '正常');
          same(p, '風險 1.21 倍', P.riskState(12.1, 10).word, '劇烈');
          same(p, '匯率位置的 key', P.fxPositionState(10).key + P.fxPositionState(50).key + P.fxPositionState(90).key, 'lowmidhigh');
          same(p, '匯率位置的面向', P.fxPositionState(10).aspect + '／' + P.fxPositionState(10).name, 'fxPosition／匯率位置');
        });

        check('position_state_is_the_pinned_lamp_word_for_word', function (p) {
          /* 對照組：位置面向的字眼被改成偏貴（或換成匯率位置那一套）→ 這一條會紅。
             位置的狀態詞就是卡片燈號的字（Indicators.positionSignal，A1-5 釘住）：這裡不重算、不換字。 */
          [[10, 'low', '相對低檔區'], [24.9, 'low', '相對低檔區'], [25, 'mid', '中性'], [50, 'mid', '中性'], [75, 'mid', '中性'], [75.1, 'high', '相對高檔區'], [99, 'high', '相對高檔區']].forEach(function (c) {
            var sig = lamp(c[0]), s = P.lampState(sig, '測試');
            same(p, '區間位置 ' + c[0] + ' 的 key', s.key, c[1]);
            same(p, '區間位置 ' + c[0] + ' 的狀態詞', s.word, c[2]);
            same(p, '區間位置 ' + c[0] + ' 跟燈號同一個字', s.word, sig.label);
            same(p, '區間位置 ' + c[0] + ' 的面向', s.aspect + '／' + s.name, 'position／位置');
            same(p, '區間位置 ' + c[0] + ' 用色點', s.icon, 'dot');
            if (['偏便宜', '中間', '偏貴', '便宜', '正常'].indexOf(s.word) >= 0) p.push('位置的狀態詞不可以是「' + s.word + '」');
          });
          var w = P.ASPECTS.position.words;
          same(p, '位置三態（圖例用的那一份）', w.low + '／' + w.mid + '／' + w.high, lamp(1).label + '／' + lamp(50).label + '／' + lamp(99).label);
          same(p, '這次的數字用燈號自己的規則句', P.lampState(lamp(91), '').because, '位於52 週區間第 91 百分位 → 高於 75% → 相對高檔區');
          same(p, '有給規則句就用給的', P.lampState(lamp(91), '位於近 40 個交易日（資料自 2026-08-01）區間第 91 百分位 → 高於 75%').because,
               '位於近 40 個交易日（資料自 2026-08-01）區間第 91 百分位 → 高於 75% → 相對高檔區');
          var none = P.lampState(I.positionSignal(null));
          same(p, '沒有資料', none.key + '／' + none.word + '／' + none.icon, 'na／資料不足／none');
          same(p, '沒有資料的原因', none.because, '歷史資料還不夠算出區間位置');
          same(p, '連燈號都沒有', P.lampState(null).key, 'na');
        });

        check('premium_state_uses_own_quartiles_not_the_median', function (p) {
          /* 對照組：折溢價用錯規則（拿去跟中位數比一成）→ 這一條會紅。 */
          function st(pct, p25, p75, n) { return P.premiumState({ pct: pct, p25: p25, p75: p75, n: n, min: 20, tag: '確定' }); }
          same(p, '低於第 25 百分位', st(0.09, 0.1, 0.9, 30).word, '便宜');
          same(p, '剛好第 25 百分位', st(0.1, 0.1, 0.9, 30).word, '正常');
          same(p, '中間', st(0.5, 0.1, 0.9, 30).word, '正常');
          same(p, '剛好第 75 百分位', st(0.9, 0.1, 0.9, 30).word, '正常');
          same(p, '高於第 75 百分位', st(0.91, 0.1, 0.9, 30).word, '偏貴');

          var outer = 0;
          var d = box('<div class="k"><span data-term-pending="RSI">RSI (14)</span></div><div class="k">現價 vs <span data-term-pending="移動平均">MA20</span></div>' +
                      '<div class="k"><span data-term-pending="沒有這個詞">照樣印</span></div>');
          d.addEventListener('click', function () { outer++; });
          var before = d.textContent;
          G.upgrade(d);
          same(p, '字不可以變', d.textContent, before);
          if (d.querySelector('[data-term-pending]')) p.push('記號沒有清掉');
          var btns = d.querySelectorAll('button.term');
          if (btns.length !== 2) { p.push('兩個有定義的名詞要變成按鈕，得到 ' + btns.length); return; }
          same(p, '按鈕上的字', btns[0].textContent + '｜' + btns[1].textContent, 'RSI (14)｜MA20');
          same(p, '按鈕對到的名詞', btns[0].getAttribute('data-term') + '｜' + btns[1].getAttribute('data-term'), 'RSI｜移動平均');
          btns[1].click();
          var def = d.querySelector('.term-def');
          if (!def || def.textContent.indexOf('移動平均：') !== 0) p.push('升級之後點一下要展開解釋');
          same(p, '點名詞不往外傳', outer, 0);
          G.upgrade(d);                                          // 再叫一次不會壞、也不會多掛一個監聽
          btns[1].click();
          if (d.querySelector('.term-def')) p.push('再點一下應該收起來（監聽不可以掛兩個）');
        });
      }
      document.getElementById('result').textContent = JSON.stringify({ loaded: loaded, total: results.length, results: results });
    })();
  </script>
</body>
</html>
