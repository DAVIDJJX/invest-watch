          if (t.indexOf('89.5%') < 0 || t.indexOf('+0.089%') < 0) p.push('主要比較的數字沒顯示');
          if (t.indexOf('-0.063%／+1.244%') < 0) p.push('最差與最好沒顯示');
          if (t.indexOf('4.50000／4.40000') < 0) p.push('A 與 B 平均匯率的中位數沒顯示');
          var main = $$('#fx table.fx-table').filter(function (x) { return x.innerText.indexOf('主要比較') >= 0; })[0];
          if (!main || main.tBodies[0].rows.length !== 1) p.push('回測表應該只有主要比較一列（舊模型的對照列已經拿掉）');
          else if (main.tBodies[0].rows[0].cells[6].innerText.trim() !== '100.0%') p.push('沒有顯示 B 在期限前換完的視窗比例');
          if (t.indexOf('所需步調') >= 0) p.push('舊模型的對照列還在');
          var pure = $('#fx-pure');
          if (!pure || pure.innerText.indexOf('77.6%') < 0 || pure.innerText.indexOf('95.9%') < 0 || pure.innerText.indexOf('4.30000') < 0 ||
              pure.innerText.indexOf('不能直接比') < 0) p.push('純 B 的沒換完比例、平均匯率與「不能直接比」沒顯示');
          if (t.indexOf('歷史模擬') < 0) p.push('資料標籤「歷史模擬」沒顯示');
          if (t.indexOf('模型：預算池') < 0) p.push('沒有寫是哪一個模型算的');
          if (t.indexOf('不偷看未來') < 0) p.push('沒有寫百分位只用當時之前的資料');
          if (t.indexOf('依位置調整換得比較便宜的有 89.5%') < 0 || t.indexOf('最差的一次反而貴 0.06%') < 0) p.push('回測的白話那一句沒有帶數字');
          var flat = JSON.parse(JSON.stringify(FIX.fx));
          flat.backtest.main.winSharePct = 0; flat.backtest.main.tieSharePct = 100; flat.backtest.main.medianImprovePct = 0; flat.backtest.main.worstImprovePct = 0;
          if (fxBox(flat, { status: 'unset' }).innerText.indexOf('兩種做法每一次都換到一樣的匯率，沒有差別') < 0) p.push('全部平手時白話要直說沒有差別');
          var thin = JSON.parse(JSON.stringify(FIX.fx));
          thin.backtest.main = { model: '預算池', n: 0, reason: '資料不足：湊不出任何一個 36 個月的視窗（決策點 20 個）' };
          var tb = fxBox(thin, { status: 'unset' });
          if (tb.innerText.indexOf('湊不出任何一個 36 個月的視窗') < 0) p.push('回測資料不足時要寫原因');
        });
        check('fx_fixed_notes_are_always_there', function (p) {
          var notes = ['人民幣匯率受人民銀行每日中間價管理，政策影響大，依歷史資料訂的規則可靠度低於股票', '以上為量化整理與歷史模擬，未經實盤驗證，不構成投資' + '建' + '議'];
          var t = $('#fx').innerText;
          notes.forEach(function (n) { if (t.indexOf(n) < 0) p.push('固定註記沒顯示：' + n.slice(0, 12)); });
          var none = fxBox(null, { status: 'unset' });
          if (!none.querySelector('.warn') || none.innerText.indexOf('讀不到') < 0) p.push('沒有 fx.json 時要紅字說讀不到');
          notes.forEach(function (n) { if (none.innerText.indexOf(n) < 0) p.push('讀不到資料時固定註記也要在'); });
          if (none.querySelector('#fx-glance')) p.push('讀不到資料時不該畫一眼看懂');
          var nobt = JSON.parse(JSON.stringify(FIX.fx)); nobt.backtest = { reason: '沒有 fx_cny 的週線長歷史' };
          var nb = fxBox(nobt, { status: 'unset' });
          if (nb.innerText.indexOf('沒有歷史模擬的結果') < 0) p.push('沒有回測時要說沒有');
          if (nb.querySelectorAll('#fx-glance .glance')[2].innerText.indexOf('固定分批') < 0) p.push('沒有回測時預設固定分批');
        });
        check('fx_unset_state_shows_no_amounts_and_no_form', function (p) {
          var d = fxBox(FIX.fx, { status: 'unset', reason: '私人倉庫裡還沒有設定檔' });
          var t = d.innerText;
          if (t.indexOf('未設定') < 0) p.push('沒有顯示未設定');
          if (!d.querySelector('#fxp-load')) p.push('沒有讀取按鈕');
          if (d.querySelector('#fxp-form')) p.push('未設定且不能編輯時不該有表單');
          if (d.querySelector('#fxp-result')) p.push('未設定時不該有試算結果');
          AMOUNTS.forEach(function (a) { if (d.innerHTML.indexOf(a) >= 0) p.push('未設定的畫面出現金額 ' + a); });
          if (/[0-9] 元/.test(d.querySelector('#fx-plan').innerText)) p.push('未設定的畫面不該出現任何「元」的金額');
          var d2 = fxBox(FIX.fx, { status: 'unset', reason: 'x', showForm: true, canEdit: true, formValues: FxPlan.toFormValues(FxPlan.emptyTemplate()) });
          if (!d2.querySelector('#fxp-form') || !d2.querySelector('#fxp-save')) p.push('可以編輯時應該顯示建立設定檔的表單');
          var d3 = fxBox(FIX.fx, { status: 'error', reason: '測試錯誤' });
          if (!d3.querySelector('#fx-plan .warn') || d3.innerText.indexOf('測試錯誤') < 0) p.push('讀不到私人設定時要紅字');
        });
        check('fx_set_state_prints_both_numbers_and_the_larger_one', function (p) {
          /* 對照組：只印本月額度、不印「比例 × 月預算」與「保底」兩個數字 → 這一條會紅。 */
          var r = fxResult;
          if (!r.ok) { p.push('假設定沒算出來'); return; }
          var box = $('#fxp-result');
          if (!box) { p.push('沒有試算結果區'); return; }
          var t = box.innerText;
          var floorTwd = (22222 - 3333 / 4.4444) / 6 * 5;                     // 目標那一半：還差的人民幣 × 即期賣出 5 ÷ 剩餘 6 個月
          if (Math.abs(r.floor.twd - floorTwd) > 1e-6) p.push('保底算錯：' + r.floor.twd + ' 對 ' + floorTwd);
          function money(x) { return Math.round(x).toLocaleString('zh-TW'); }
          var rowsText = Array.prototype.map.call(box.querySelectorAll('table.fx-table tbody tr'), function (tr) { return tr.innerText.replace(/\s+/g, ' ').trim(); });
          function rowOf(name) { return rowsText.filter(function (x) { return x.indexOf(name) === 0; })[0] || ''; }
          if (rowOf('預算池（月初）').indexOf('30,000 元') < 0) p.push('月初的池子應該是三個月預算減掉之前換的：' + rowOf('預算池（月初）'));
          if (rowOf('預算池（月初）').indexOf('從 2026-07 起 3 個月') < 0) p.push('池子那一列沒有寫怎麼算的');
          if (rowOf('規則額度').indexOf('6,000 元') < 0 || rowOf('規則額度').indexOf('池子 × 20%') < 0) p.push('規則額度應該是池子 × 20%：' + rowOf('規則額度'));
          if (rowOf('保底').indexOf(money(floorTwd) + ' 元') < 0 || rowOf('保底').indexOf('池子 ÷ 剩餘 6 個月') < 0 || rowOf('保底').indexOf('5,000 元') < 0 ||
              rowOf('保底').indexOf('兩個取較大者') < 0) p.push('保底那一列要印池子那一半、目標那一半與取較大者：' + rowOf('保底'));
          if (rowOf('預算池（現在）').indexOf('28,889 元') < 0) p.push('現在的池子沒印');
          if (t.indexOf('不會把剩下的池子再乘一次比例') < 0) p.push('沒有說明本月額度用月初的池子算');
          if (t.indexOf('固定分批（A）') < 0 || t.indexOf(money(11111) + ' 元') < 0) p.push('固定分批的金額沒印');
          if (t.indexOf(money(floorTwd) + ' 元') < 0) p.push('保底的金額沒印');
          var tight = FxPlan.compute(FxPlan.fromForm({ start: '2026-09', budget: '11111', target: '22222', deadline: '2026-10' }), FIX.fx.currencies.CNY, '2026-09', 'A');
          var tbx = fxBox(FIX.fx, { status: 'set', result: tight, formValues: {}, canEdit: false }).querySelector('#fxp-result tr.fx-here');
          if (!tbx || tbx.innerText.indexOf('11,111 元') < 0 || tbx.innerText.indexOf('超過池子了，以池子為上限') < 0) p.push('保底比池子大時，本月額度要以池子為上限並寫出來');
          if (r.quotaFrom !== 'floor' || t.indexOf('保底比較大') < 0) p.push('這組假資料應該是保底比較大');
          var row = box.querySelector('tr.fx-here');
          if (!row || row.innerText.indexOf('本月額度') < 0 || row.innerText.indexOf(money(floorTwd) + ' 元') < 0) p.push('本月額度那一列沒有標出來');
          if (t.indexOf('本月已換') < 0 || t.indexOf(money(1111) + ' 元') < 0) p.push('本月已換沒印');
          if (t.indexOf(money(floorTwd - 1111) + ' 元') < 0) p.push('本月還沒換的額度沒印');
          if (t.indexOf('已換紀錄與累計') < 0 || t.indexOf('4.4444') < 0) p.push('已換紀錄沒印');
          if (t.indexOf('平均匯率') < 0 || t.indexOf('還差') < 0) p.push('累計與還差多少沒印');
          if (box.querySelectorAll('table').length < 2) p.push('應有試算表與紀錄表');
          var bad = fxBox(FIX.fx, { status: 'set', result: FxPlan.compute(FxPlan.fromForm({ budget: 'abc' }), FIX.fx.currencies.CNY, '2026-09', 'A'), formValues: {}, canEdit: true });
          if (!bad.querySelector('#fxp-result .warn') || bad.innerText.indexOf('月預算要填數字') < 0) p.push('設定檔有錯時要紅字列出，不是硬算');
        });
        check('fx_plan_keys_and_amounts_never_reach_ids_or_attributes', function (p) {
          /* 對照組：表單欄位改用設定檔的鍵名當 id、或把金額塞進 data- 屬性 → 這一條會紅。 */
          var html = document.documentElement.outerHTML.replace(/<script[\s\S]*?<\/script>/g, '');
          ['monthlyBudget' + 'Twd', 'target' + 'Cny', 'deadline' + 'Month', 'conver' + 'ted', 'start' + 'Month'].forEach(function (k) {
            if (html.indexOf(k) >= 0) p.push('渲染出來的 DOM 裡出現換匯設定檔的鍵名「' + k + '」');
          });
          if (html.indexOf('FAKE_FX') >= 0) p.push('fixture 名稱洩進 DOM');
          var inputs = $$('#fxp-form input');
          if (inputs.length !== 4 + 3 * 3) p.push('表單應有 4 個設定欄位＋（2 筆紀錄＋1 列空白）× 3 格，得到 ' + inputs.length);
          inputs.forEach(function (i) {
            if (i.id.indexOf('fxp_') !== 0 || i.name !== i.id) p.push('表單欄位的 id／name 不是 fxp_ 開頭：' + i.id + '／' + i.name);
          });
          if ($('#fxp_budget').value !== '11111' || $('#fxp_r_0').value !== '4.4444' || $('#fxp_start').value !== '2026-07') p.push('表單沒有帶入設定值');
          // 金額只能出現在文字與輸入框的 value；其他任何屬性（id、name、class、data-*、title、href…）都不行
          $$('#fx *').forEach(function (el) {
            Array.prototype.forEach.call(el.attributes, function (a) {
              if (a.name === 'value') return;
              AMOUNTS.forEach(function (x) { if (String(a.value).indexOf(x) >= 0) p.push('金額 ' + x + ' 出現在 <' + el.tagName.toLowerCase() + '> 的 ' + a.name + ' 屬性'); });
            });
          });
          // 公開的那一半（#fx 扣掉 #fx-plan）一個金額都不能有
          var pub = $('#fx').cloneNode(true);
          var priv = pub.querySelector('#fx-plan');
          priv.parentNode.removeChild(priv);
          AMOUNTS.forEach(function (x) { if (pub.innerHTML.indexOf(x) >= 0) p.push('公開的那一半出現金額 ' + x); });
        });
        check('fx_form_reads_back_and_skips_blank_rows', function (p) {
          var d = document.createElement('div');
          d.innerHTML = AnalysisDebug.renderFxForm(FxPlan.toFormValues(FAKE_FX_PLAN), true);
          var v = AnalysisDebug.readFxForm(d);
          if (v.start !== '2026-07' || v.budget !== '11111' || v.target !== '22222' || v.deadline !== '2027-02') p.push('讀回來的設定值不對');
          if (v.records.length !== 2) p.push('最後那一列空白不該算一筆，得到 ' + v.records.length + ' 筆');
          if (JSON.stringify(FxPlan.fromForm(v)) !== JSON.stringify(FAKE_FX_PLAN)) p.push('表單讀回來再組一次，應該跟原本的設定一樣');
          d.querySelector('#fxp_t_1').value = '';
          d.querySelector('#fxp_m_1').value = '';
          d.querySelector('#fxp_r_1').value = '';
          if (AnalysisDebug.readFxForm(d).records.length !== 1) p.push('三格都清空＝刪掉那一筆');
          var ro = document.createElement('div');
          ro.innerHTML = AnalysisDebug.renderFxForm(FxPlan.toFormValues(FAKE_FX_PLAN), false);
          if (ro.querySelector('#fxp-save')) p.push('不能編輯時不該有儲存按鈕');
          if (!ro.querySelector('#fxp_budget').disabled) p.push('不能編輯時欄位要鎖住');
          if (AnalysisDebug.currentMonth('2026-09-30T23:30:00+08:00') !== '2026-09' || AnalysisDebug.currentMonth('2026-09-30T17:00:00Z') !== '2026-10') p.push('現在是幾月要用台北時間算');
        });
        check('missing_status_is_loud', function (p) {
          var box = document.createElement('div');
          AnalysisDebug.render({ status: null, risk: null, decompose: null }, { status: box, risk: box, decompose: box });
          var box2 = document.createElement('div');
          box2.innerHTML = AnalysisDebug.renderStatus(null);
          if (!box2.querySelector('.warn') || box2.innerText.indexOf('讀不到') < 0) p.push('沒有 status 時沒有紅字說讀不到');
          var box3 = document.createElement('div');
          box3.innerHTML = AnalysisDebug.renderRisk(null);
          if (box3.innerText.indexOf('讀不到') < 0) p.push('沒有 risk 時沒有說讀不到');
        });
      }
      document.getElementById('result').textContent = JSON.stringify({
        loaded: loaded, total: results.length, results: results
      });
    })();
  </script>
