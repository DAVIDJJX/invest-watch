          /* 對照組：點表頭裡的名詞也會觸發排序 → 這一條會紅。 */
          function termsIn(sel) { return $$(sel + ' button.term').map(function (b) { return b.getAttribute('data-term'); }); }
          same(p, '風險表表頭的名詞', termsIn('#risk table.sortable thead').join('、'), '年化波動、年化波動、回檔、目前距高點、資料標籤');
          if (termsIn('#risk h3').indexOf('相關係數') < 0) p.push('相關矩陣的標題要有名詞');
          ['追蹤差', '折溢價', '淨值', '條塊溢價'].forEach(function (x) { if (termsIn('#cost').indexOf(x) < 0) p.push('成本區的「' + x + '」要可以點'); });
          if (termsIn('#decompose').indexOf('殘差') < 0) p.push('拆解區的「殘差」要可以點');
          ['保底', '視窗重疊', '預算池', '歷史模擬', '百分位'].forEach(function (x) { if (termsIn('#fx').indexOf(x) < 0) p.push('換匯助手的「' + x + '」要可以點'); });
          var ths = $$('#risk table.sortable th.sortable');
          same(p, '表頭的字不變', ths.map(function (x) { return x.innerText.trim(); }).join('｜'), '標的｜類別｜幣別｜最後完成週棒｜週數｜年化波動 1 年｜年化波動 5 年｜最大回檔｜目前距高點｜10 年視窗｜資料標籤');
          AnalysisDebug.wireSorting($('#risk'));
          var table = $('#risk table.sortable'), before = $$('#risk table.sortable tbody tr').map(function (r) { return r.cells[0].innerText; }).join('｜');
          var btn = ths[7].querySelector('button.term');
          btn.click();
          if (!ths[7].querySelector('.term-def')) p.push('點表頭的名詞沒有展開解釋');
          if (ths[7].classList.contains('asc') || ths[7].classList.contains('desc')) p.push('點名詞不可以觸發排序');
          same(p, '點名詞之後列的順序不變', $$('#risk table.sortable tbody tr').map(function (r) { return r.cells[0].innerText; }).join('｜'), before);
          ths[7].querySelector('.term-def').click();
          if (ths[7].classList.contains('asc') || ths[7].classList.contains('desc')) p.push('點展開的解釋也不可以觸發排序');
          btn.click();
          ths[5].click();
          if (!ths[5].classList.contains('desc')) p.push('點表頭的其他地方要照常排序');
          AnalysisDebug.sortTable(table, 0, 'asc');
        });
        check('correlation_has_one_sentence_per_asset_not_per_cell', function (p) {
          var ids = FIX.risk.correlation.ids, items = $$('#corr-plain li');
          same(p, '一個標的一句', items.length, ids.length);
          if ($$('#risk .matrix-wrap .plain-line').length) p.push('矩陣的格子裡不寫白話');
          var first = items[0].innerText;
          if (first.indexOf('gspc') !== 0 || first.indexOf('S&P 500') < 0) p.push('那一句前面要有代號與名稱：' + first);
          same(p, '只有兩個標的有成對資料時', items[0].querySelector('.plain-line').innerText, '最常跟它同方向走的是 00679B（-0.12）；走勢最沒有關係的是 00679B（-0.12）；沒有哪一檔常常跟它反方向。');
          var tsmc = items[ids.indexOf('tw2330')].querySelector('.plain-line').innerText;
          same(p, '有反向的那一檔', tsmc, '最常跟它同方向走的是 tw00646（0.51）；走勢最沒有關係的是 00679B（0.03）；常常跟它反方向的是 fx_usd（-0.32）。');
          items.forEach(function (li) { if (!li.querySelector('.plain-line').innerText.trim()) p.push('有一句是空的'); });
          // S&P 500 指數與它的總報酬版本不互相當「最常同方向」
          var twin = { window: '3 年（156 週）', label: '單一來源', matrix: {
            gspc: { gspc: { r: 1, n: 156 }, sp500tr: { r: 0.999, n: 156 }, nvda: { r: 0.71, n: 156 }, wti: { r: 0.04, n: 156 } },
            sp500tr: { sp500tr: { r: 1, n: 156 }, gspc: { r: 0.999, n: 156 }, nvda: { r: 0.7, n: 156 }, wti: { r: 0.05, n: 156 } } } };
          var tw = document.createElement('div');
          tw.innerHTML = AnalysisDebug.corrSentences(twin, { gspc: { name: 'S&P 500 指數' }, sp500tr: { name: 'S&P 500 總報酬指數' }, nvda: { name: 'NVIDIA' }, wti: { name: 'WTI 原油' } }, ['gspc', 'sp500tr']);
          var lines = Array.prototype.map.call(tw.querySelectorAll('.plain-line'), function (l) { return l.textContent; });
          same(p, 'S&P 500 的那一句', lines[0], '最常跟它同方向走的是 NVIDIA（0.71）；走勢最沒有關係的是 WTI 原油（0.04）；沒有哪一檔常常跟它反方向。');
          same(p, '總報酬版本的那一句', lines[1], '最常跟它同方向走的是 NVIDIA（0.70）；走勢最沒有關係的是 WTI 原油（0.05）；沒有哪一檔常常跟它反方向。');
        });
        check('adhoc_detail_gets_a_glance_row_and_plain_lines', function (p) {
          var d = document.createElement('div');
          d.innerHTML = AnalysisDebug.renderAdhoc({ status: 'index', index: FIX.adhocIndex, detail: FIX.adhocDetail });
          var cells = d.querySelectorAll('#adhoc-glance .glance');
          if (cells.length !== 2) { p.push('試算結果的圖示列應有兩格（風險、最像的三檔），得到 ' + cells.length); return; }
          same(p, '風險那一格', cells[0].querySelector('.glance-title').innerText + '／' + cells[0].querySelector('.glance-word').innerText, '風險／資料不足');
          same(p, '風險資料不足的原因', cells[0].querySelector('.glance-because').innerText, '資料不足：只有 200 週（至少要 234 週）');
          if (cells[0].querySelector('.glance-rule').innerText.indexOf('規則：1 年波動比 5 年波動') !== 0) p.push('風險那一格沒有印規則');
          same(p, '最像的三檔', cells[1].querySelector('.glance-word').innerText, 'gspc、tw00646、nvda');
          same(p, '最像的三檔的白話', cells[1].querySelector('.glance-because').innerText, '現有的標的裡，走勢跟它最像的是 S&P 500（0.91）、00646（0.88）、NVIDIA（0.61）。');
          if (cells[1].querySelector('.glance-rule').innerText.indexOf('規則：') !== 0) p.push('最像的三檔沒有印規則');
          if (d.innerText.indexOf('兩格各看各的') < 0) p.push('沒有寫明兩格不加總');
          var lines = Array.prototype.map.call(d.querySelectorAll('.plain-line'), function (l) { return l.innerText.trim(); });
          ['照最近 1 年的起伏，一年裡漲跌 12% 左右算平常。', '歷史上最慘的一次曾經跌掉大約三分之一，2021-01-04 才漲回原來的高點。', '比 2026-08-31 的高點低 4.4%。',
           '歷史上最慘的一次曾經跌掉大約三分之一。'].forEach(function (s) { if (lines.indexOf(s) < 0) p.push('試算少了這一行白話：' + s); });
          lines.forEach(function (s) { if (!s) p.push('試算有一行白話是空的'); });
          var full = JSON.parse(JSON.stringify(FIX.adhocDetail));
          full.risk.volatility['5y'] = { pct: 10, weeks: 260, window: '260 週', from: '2021-09-20', through: '2026-09-14', label: '單一來源' };
          var f = document.createElement('div');
          f.innerHTML = AnalysisDebug.renderAdhocDetail(full);
          same(p, '有 5 年波動時', f.querySelector('#adhoc-glance .glance-word').innerText, '劇烈');
          var bare = JSON.parse(JSON.stringify(FIX.adhocDetail)); bare.correlation = { reason: '資料不足：週線太短' };
          var b = document.createElement('div');
          b.innerHTML = AnalysisDebug.renderAdhocDetail(bare);
          same(p, '沒有相關資料時', b.querySelectorAll('#adhoc-glance .glance')[1].querySelector('.glance-word').innerText, '資料不足');
        });
        check('missing_status_is_loud', function (p) {
          var box = document.createElement('div');
          AnalysisDebug.render({ status: null, risk: null, decompose: null }, { status: box, risk: box, decompose: box });
          var box2 = document.createElement('div');
          box2.innerHTML = AnalysisDebug.renderStatus(null);
          if (!box2.querySelector('.warn') || box2.innerText.indexOf('讀不到') < 0) p.push('沒有 status 時沒有紅字說讀不到');
          var box3 = document.createElement('div');
          box3.innerHTML = AnalysisDebug.renderRisk(null);
          if (box3.innerText.indexOf('讀不到') < 0) p.push('沒有 risk 時沒有說讀不到');
        });
      }
      document.getElementById('result').textContent = JSON.stringify({
        loaded: loaded, total: results.length, results: results
      });
    })();
  </script>
