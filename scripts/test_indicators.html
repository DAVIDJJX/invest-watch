<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>js/indicators.js 燈號釘住測試頁（由 scripts/test_indicators_js.py 用無頭瀏覽器開）</title>
</head>
<body>
<!--
  A1-5 的「既有功能不變」證據：燈號（Indicators.computeAll 的 signal）與指標對固定輸入的輸出，
  在 A1-5 動任何前端程式【之前】先用 main 上的 js/indicators.js 產生一份 fixture
  （scripts/fixtures/indicators_signal.json），之後每次測試都重算一次、逐值比對。
  輸入是合成的日線（不是任何真實資料）：五條形狀不同的序列 × 兩個現價。
-->
<script src="../js/indicators.js"></script>
<pre id="result">（尚未執行）</pre>
<script>
(function () {
  function series(kind, n) {
    var pts = [], v = 100, d0 = Date.UTC(2025, 8, 1);
    for (var i = 0; i < n; i++) {
      if (kind === 'up') v = v * 1.004;
      else if (kind === 'down') v = v * 0.996;
      else if (kind === 'flat') v = 100 + ((i * 7) % 3) * 0.1;
      else if (kind === 'wave') v = 100 + 15 * Math.sin(i / 9) + ((i * 13) % 5) * 0.2;
      else if (kind === 'crash') v = i < n - 12 ? 100 + i * 0.3 : 100 + (n - 12) * 0.3 - (i - (n - 12)) * 4;
      var day = new Date(d0 + i * 86400000);
      pts.push({ d: day.toISOString().slice(0, 10), c: Math.round(v * 1000) / 1000 });
    }
    return pts;
  }
  function round(x) {
    if (typeof x === 'number') return Math.round(x * 1e6) / 1e6;
    if (Array.isArray(x)) return x.map(round);
    if (x && typeof x === 'object') { var o = {}; Object.keys(x).sort().forEach(function (k) { o[k] = round(x[k]); }); return o; }
    return x;
  }
  var out = {};
  ['up', 'down', 'flat', 'wave', 'crash'].forEach(function (kind) {
    [260, 40].forEach(function (n) {
      var pts = series(kind, n);
      var last = pts[pts.length - 1].c;
      [last, last * 1.05, last * 0.93].forEach(function (price, j) {
        var key = kind + '_' + n + '_' + j;
        try { out[key] = round(window.Indicators.computeAll(pts, Math.round(price * 1000) / 1000)); }
        catch (e) { out[key] = { error: String(e && e.message) }; }
      });
    });
  });
  document.getElementById('result').textContent = JSON.stringify({ loaded: !!window.Indicators, cases: out });
})();
</script>
</body>
</html>
