<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>面向（位置、風險、成本、趨勢）離線測試頁</title>
</head>
<body>
  <!-- 這一頁不連網、不讀資料檔：把假的行情、日線、risk／cost／fx 餵給 js/card-analysis.js 的 aspects()，逐題檢查每個面向的狀態、
       圖示列與點開後的細節。結果以 JSON 放在 id 叫 result 的區塊，給 scripts/test_aspects_js.py 讀。假資料的數字一看就是假的。 -->
  <div id="mount"></div>
  <pre id="result"></pre>
  <script src="../js/indicators.js"></script>
  <script src="../js/plain.js"></script>
  <script src="../js/glossary.js"></script>
  <script src="../js/card-analysis.js"></script>
  <script>
    (function () {
      var results = [];
      function check(name, fn) {
        var problems = [];
        try { fn(problems); } catch (e) { problems.push('例外：' + (e && e.message)); }
        results.push({ name: name, ok: problems.length === 0, problems: problems });
      }
      function box(html) { var d = document.createElement('div'); d.innerHTML = html; document.getElementById('mount').appendChild(d); return d; }
      function same(p, what, got, want) { if (got !== want) p.push(what + '：應為「' + want + '」，得到「' + got + '」'); }
      function clone(x) { return JSON.parse(JSON.stringify(x)); }
      // 不該出現的字（拆開拼，免得守門掃到這一頁自己）；台銀牌價的欄位名稱是價格的名字，先拿掉再查
      var BANNED = ['偏' + '買', '偏' + '賣', '主' + '力', '建' + '議', '買' + '進', '賣' + '出', '總' + '分', '分' + '數'];
      var PRICE_NAMES = ['本行賣' + '出', '本行買入', '即期賣' + '出', '即期買入'];
      var COUNTING = /[0-9０-９一二兩三四五六七八九十]+\s*(個|項)\s*(面向|指標|燈號|圖示)/;
      var VOCAB = { position: ['相對低檔區', '中性', '相對高檔區', '資料不足', '暫時讀不到'],
                    risk: ['平靜', '正常', '劇烈', '資料不足', '暫時讀不到'],
                    cost: ['便宜', '正常', '偏貴', '資料不足', '不適用', '暫時讀不到'],
                    trend: ['向上', '持平', '向下', '資料不足', '暫時讀不到'] };

      /* 合成的日線（跟 scripts/test_indicators.html 同一個產生法，不是任何真實資料） */
      function series(kind, n) {
        var pts = [], v = 100, d0 = Date.UTC(2025, 8, 1);
        for (var i = 0; i < n; i++) {
          if (kind === 'up') v = v * 1.004;
          else if (kind === 'down') v = v * 0.996;
          else if (kind === 'flat') v = 100 + ((i * 7) % 3) * 0.1;
          else if (kind === 'wave') v = 100 + 15 * Math.sin(i / 9) + ((i * 13) % 5) * 0.2;
          else if (kind === 'crash') v = i < n - 12 ? 100 + i * 0.3 : 100 + (n - 12) * 0.3 - (i - (n - 12)) * 4;
          var day = new Date(d0 + i * 86400000);
          pts.push({ d: day.toISOString().slice(0, 10), c: Math.round(v * 1000) / 1000 });
        }
        return pts;
      }
      function asset(id, type, extra) {
        var a = { id: id, name: '測試 ' + id, type: type, status: 'ok', price: 100, decimals: 2, date: '2026-09-30', group: '測試', currency: 'TWD' };
        Object.keys(extra || {}).forEach(function (k) { a[k] = extra[k]; });
        return a;
      }
      function vol(y1, y5) {
        return { '1y': typeof y1 === 'number' ? { pct: y1, from: '2025-09-29', through: '2026-09-21', label: '單一來源' } : { pct: null, reason: y1 },
                 '5y': typeof y5 === 'number' ? { pct: y5, from: '2021-10-04', through: '2026-09-21', label: '單一來源' } : { pct: null, reason: y5 } };
      }
      function riskAsset(cls, y1, y5) {
        return { name: '測試', assetClass: cls, currency: 'TWD', bars: 500, lastBar: '2026-09-21', dataLabel: '單一來源', volatility: vol(y1, y5),
                 maxDrawdown: { pct: -40, peakDate: '2020-02-17', troughDate: '2020-03-16', recoveredDate: '2020-08-24', label: '單一來源' },
                 currentDrawdown: { pct: -10, highDate: '2026-08-10', dataThrough: '2026-09-21', label: '單一來源' } };
      }
      // A2a：risk.json 的 trend（analyze.py 算的；這裡是 252 個 10＋最後 20 算出來的值）
      var TREND_UP = { maDays: 200, retDays: 252, days: 253, through: '2026-09-30', ma200: 10.05, dist200Pct: 99.005, above: true, ret12mPct: 100,
                       from200: '2025-10-24', from12: '2025-09-01', label: '單一來源' };
      var RISK = { assets: {
        tw00646: riskAsset('index_etf', 7.9, 10), tw00679b: riskAsset('bond_etf', 10, '資料不足：只有 40 週（至少要 234 週）'),
        tw2330: riskAsset('stock', 12.1, 10), twii: riskAsset('index', 10, 10), btc: riskAsset('crypto', 8, 10), wti: riskAsset('commodity', 12, 10),
        gold_intl: riskAsset('commodity', 12.5, 10), fx_usd: riskAsset('fx', 4, 5), fx_cny: riskAsset('fx', 3, 5), newthing: riskAsset('reit', 10, 10) },
        trend: { fx_usd: TREND_UP, gold_twd: TREND_UP, tw00679b: TREND_UP, gspc: TREND_UP, tw00646: TREND_UP,
                 gold_bar: { maDays: 200, retDays: 252, days: 12, through: '2026-09-30', ma200: null, dist200Pct: null, above: null, ret12mPct: null,
                             reason: '台銀不公布條塊的歷史牌價；本站自己累積的只有 12 個交易日，不夠算 200 日均線與 12 個月報酬', label: '單一來源' } },
        correlation: { window: '3 年（156 週）', label: '單一來源', matrix: {
          tw00646: { tw00646: { r: 1, n: 156 }, twii: { r: 0.9, n: 156, through: '2026-09-08' }, tw00679b: { r: 0.05, n: 156, through: '2026-09-08' }, fx_usd: { r: -0.35, n: 154, through: '2026-09-08' } } } } };
      function daily(n, value, last) {
        var out = [];
        for (var i = 0; i < n; i++) out.push({ d: '2026-08-' + ('0' + (i % 28 + 1)).slice(-2), g1000Pct: i === n - 1 && last !== undefined ? last : value + (i % 3 - 1) * 0.1 });
        return out;
      }
      var COST = {
        trackingDifference: { primary: { benchmark: '^SP500TR', available: true, label: '估算', windows: { '3y': { diffPct: -3, annualizedDiffPct: -1, from: '2023-09-18', through: '2026-09-21' } } } },
        premium: { tw00646: { status: '接了（每個交易日存一筆）', latest: [ { d: '2026-09-30', price: 77, nav: 70, premiumPct: 10, tag: '預估' }, { d: '2026-09-29', price: 76, nav: 76.38, premiumPct: 0.5, tag: '確定' } ],
                              estimated: { n: 3, reason: '累積不到 20 個交易日（目前 3）', label: '估算' }, official: { n: 3, reason: '累積不到 20 個交易日（目前 3）', label: '單一來源' } },
                   tw00679b: { status: '接了（每個交易日存一筆）', latest: [ { d: '2026-09-30', price: 25, nav: 25.1, premiumPct: -0.4, tag: '預估' }, { d: '2026-09-29', price: 25, nav: 25.09, premiumPct: -0.35, tag: '確定' } ],
                               estimated: { n: 30, medianPct: -0.2, label: '估算' },
                               official: { n: 30, from: '2026-08-18', through: '2026-09-29', medianPct: -0.2, minPct: -0.5, maxPct: 0.1, p25Pct: -0.3, p75Pct: -0.1, label: '單一來源' } } },
        goldSpread: { label: '單一來源', latest: { d: '2026-09-30', buy: 99.5, sell: 100.5, spreadPct: 1.0 }, summary: { n: 264, from: '2025-09-01', through: '2026-09-30', medianPct: 1.0 } },
        goldSpreadCny: { label: '單一來源', latest: { d: '2026-09-30', buy: 99.4, sell: 100.6, spreadPct: 1.2 }, summary: { n: 264, from: '2025-09-01', through: '2026-09-30', medianPct: 1.0 } },
        barPremium: { label: '單一來源', n: 14, from: '2026-08-31', through: '2026-09-30', daily: daily(14, 1.0),
                      latest: { d: '2026-09-30', goldSell: 100, rows: [ { spec: '1 公斤', grams: 1000, price: 100800, perGram: 100.8, premiumPct: 0.8 }, { spec: '100 公克', grams: 100, price: 10150, perGram: 101.5, premiumPct: 1.5 } ] } } };
      var FX = { currencies: {
        CNY: { assetId: 'fx_cny', label: '有對照', percentiles: { '5y': { pct: 72 } },
               spreads: { label: '有對照', spot: { d: '2026-09-29', buy: 4.95, sell: 5, spreadPct: 1.0 }, spotSpread1y: { n: 252, from: '2025-09-17', through: '2026-09-29', medianPct: 1.0 } } },
        USD: { assetId: 'fx_usd', label: '有對照', percentiles: { '5y': { pct: 33 } },
               spreads: { label: '有對照', spot: { d: '2026-09-29', buy: 29.9, sell: 30, spreadPct: 0.334 }, spotSpread1y: { n: 145, reason: '資料不足：只有 145 點（至少要 227 點）' } } } } };
      var UP = series('up', 260), DOWN = series('down', 260), WAVE = series('wave', 260);
      var ASSETS = {
        gold_twd: asset('gold_twd', 'bot_gold', { decimals: 0 }), gold_cny: asset('gold_cny', 'bot_gold', { currency: 'CNY' }),
        gold_bar: asset('gold_bar', 'bot_gold_bar', { bars: [ { spec: '1 公斤', sell: 100800 } ] }),
        gold_intl: asset('gold_intl', 'yahoo', { currency: 'USD' }), twii: asset('twii', 'twse_index'), tw2330: asset('tw2330', 'twse_stock'),
        tw00646: asset('tw00646', 'twse_stock'), tw00679b: asset('tw00679b', 'twse_stock'), btc: asset('btc', 'yahoo', { currency: 'USD' }), wti: asset('wti', 'yahoo', { currency: 'USD' }),
        fx_usd: asset('fx_usd', 'finmind_fx', { decimals: 3, date: '2026-09-29' }), fx_cny: asset('fx_cny', 'finmind_fx', { decimals: 3, date: '2026-09-29' }) };
      function ctx(points, over) {
        var c = { points: points || WAVE, historyFailed: false, risk: RISK, cost: COST, fx: FX };
        Object.keys(over || {}).forEach(function (k) { c[k] = over[k]; });
        return c;
      }
      function of(list, name) { return list.filter(function (a) { return a.aspect === name; })[0]; }

      var loaded = !!(window.CardAnalysis && window.CardAnalysis.aspects && window.Plain && window.Glossary && window.Indicators);
      if (loaded) {
        var CA = window.CardAnalysis, P = window.Plain, I = window.Indicators;
        var ALL = {};
        Object.keys(ASSETS).forEach(function (id) { ALL[id] = CA.aspects(ASSETS[id], ctx()); });

        check('aspects_come_in_a_fixed_order_each_with_word_number_and_rule', function (p) {
          same(p, '面向的順序', CA.ASPECT_ORDER.join('、'), 'position、risk、cost、trend');
          Object.keys(ALL).forEach(function (id) {
            var list = ALL[id];
            if (!list || list.length !== 4) { p.push(id + '：應該有四個面向'); return; }
            same(p, id + ' 的順序', list.map(function (a) { return a.aspect; }).join('、'), 'position、risk、cost、trend');
            list.forEach(function (a) {
              var s = a.state, tag = id + '/' + a.aspect;
              if (!s) { p.push(tag + '：沒有狀態'); return; }
              if (VOCAB[a.aspect].indexOf(s.word) < 0) p.push(tag + '：狀態詞「' + s.word + '」不在這個面向的詞表裡');
              if (!s.because) p.push(tag + '：沒有寫這次是哪個數字（或為什麼沒有狀態）');
              if (!s.rule || s.rule.indexOf('規則：') !== 0) p.push(tag + '：沒有規則句');
              if (['low', 'mid', 'high', 'na', 'none', 'error'].indexOf(s.key) < 0) p.push(tag + '：不認得的狀態 ' + s.key);
              if (s.key !== 'none' && !P.ICONS[s.icon]) p.push(tag + '：沒有圖示');
              same(p, tag + ' 的名稱', a.name, P.ASPECTS[a.aspect].name);
            });
          });
          if (CA.aspects(null, ctx()) !== null) p.push('沒有標的要回 null');
        });

        check('position_is_the_same_lamp_as_the_card_word_for_word', function (p) {
          /* 對照組：位置面向的字眼被改成偏貴（拿區間百分位去套匯率位置那一套）→ 這一條會紅。
             跟 scripts/test_indicators.html 同樣的 30 組輸入：面向的狀態詞必須等於燈號函式的輸出。 */
          var seen = {}, count = 0;
          ['up', 'down', 'flat', 'wave', 'crash'].forEach(function (kind) {
            [260, 40].forEach(function (n) {
              var pts = series(kind, n), last = pts[pts.length - 1].c;
              [last, last * 1.05, last * 0.93].forEach(function (price) {
                price = Math.round(price * 1000) / 1000;
                var ind = I.computeAll(pts, price);
                var a = of(CA.aspects(asset('x', 'yahoo', { price: price }), ctx(pts)), 'position');
                count++;
                seen[ind.signal.level] = true;
                var tag = kind + '/' + n + '/' + price;
                same(p, tag + ' 狀態詞', a.state.word, ind.signal.label);
                same(p, tag + ' 狀態', a.state.key, ind.signal.level);
                same(p, tag + ' 這次的數字', a.state.because, I.signalRule(ind.range, I.windowStart(pts, ind.range.days)) + ' → ' + ind.signal.label);
                same(p, tag + ' 圖示', a.state.icon, 'dot');
                if (['偏便宜', '中間', '偏貴', '便宜', '正常'].indexOf(a.state.word) >= 0) p.push(tag + '：位置的狀態詞不可以是「' + a.state.word + '」');
                if (a.facts.length !== 1 || a.facts[0].v !== '第 ' + ind.range.percentile.toFixed(0) + ' 百分位') p.push(tag + '：細節要列區間百分位');
                if (a.facts[0].k !== I.windowName(ind.range) + '區間位置') p.push(tag + '：視窗名稱要照實際天數寫，得到 ' + a.facts[0].k);
                if (n === 40 && a.facts[0].note.indexOf('資料自 ') < 0) p.push(tag + '：不滿一年要寫資料自哪一天');
              });
            });
          });
          same(p, '組數', count, 30);
          same(p, '三種燈號都測到', Object.keys(seen).sort().join('、'), 'high、low、mid');
          var top = of(CA.aspects(asset('x', 'yahoo', { price: UP[UP.length - 1].c }), ctx(UP)), 'position');
          same(p, '一路漲到最高', top.state.word + '／' + top.state.key, '相對高檔區／high');
          same(p, '白話', top.facts[0].plain, '把 52 週的最低價當 0、最高價當 100，現在在 100 的位置。');
          same(p, '資料日期', top.dates, '位置的資料日期：2026-09-30（日線）。');
          var bottom = of(CA.aspects(asset('x', 'yahoo', { price: DOWN[DOWN.length - 1].c }), ctx(DOWN)), 'position');
          same(p, '一路跌到最低', bottom.state.word + '／' + bottom.state.key, '相對低檔區／low');
        });

        check('position_without_data_says_why', function (p) {
          var bar = of(CA.aspects(ASSETS.gold_bar, ctx(series('flat', 14))), 'position');
          same(p, '條塊不掛燈號', bar.state.key + '／' + bar.state.word, 'na／資料不足');
          same(p, '條塊的原因', bar.state.because, '台銀不公布條塊的歷史牌價；本站自己累積的只有 14 個交易日，不夠算區間位置');
          var failed = of(CA.aspects(asset('x', 'yahoo', { status: 'error' }), ctx()), 'position');
          same(p, '更新失敗', failed.state.key + '／' + failed.state.because, 'na／這一項資料更新失敗，沒有現價可以算位置');
          var nohist = of(CA.aspects(asset('x', 'yahoo'), ctx([], { historyFailed: true })), 'position');
          same(p, '日線讀不到', nohist.state.key + '／' + nohist.state.because, 'na／歷史資料讀取失敗，無法計算區間位置');
          var empty = of(CA.aspects(asset('x', 'yahoo', { price: null }), ctx([])), 'position');
          same(p, '一點資料都沒有', empty.state.key + '／' + empty.state.because, 'na／歷史資料還不夠算出區間位置');
          [bar, failed, nohist, empty].forEach(function (a) { if (a.facts.length) p.push('沒有狀態就不該列數字'); });
        });

        check('risk_compares_one_year_to_five_years', function (p) {
          /* 對照組：風險的門檻改壞（兩成改成五成）→ 這一條會紅。 */
          function word(id) { var s = of(ALL[id], 'risk').state; return s.key + '／' + s.word; }
          same(p, '0.79 倍', word('tw00646'), 'low／平靜');
          same(p, '1.0 倍', word('twii'), 'mid／正常');
          same(p, '0.8 倍（剛好不算平靜）', word('btc'), 'mid／正常');
          same(p, '1.2 倍（剛好不算劇烈）', word('wti'), 'mid／正常');
          same(p, '1.21 倍', word('tw2330'), 'high／劇烈');
          same(p, '1.25 倍', word('gold_intl'), 'high／劇烈');
          var r646 = of(ALL.tw00646, 'risk');
          same(p, '這次的數字', r646.state.because, '1 年波動 7.9%，5 年波動 10.0% → 平靜');
          same(p, '規則', r646.state.rule, '規則：1 年波動比 5 年波動低兩成以上算平靜、高兩成以上算劇烈，其餘算正常');
          same(p, '列的數字', r646.facts.map(function (f) { return f.k; }).join('、'), '年化波動 1 年、年化波動 5 年、1 年相對 5 年、最大回檔、目前距高點');
          same(p, '倍數', r646.facts[2].v, '0.79 倍');
          same(p, '資料日期', r646.dates, '風險的資料日期：2026-09-21（最後一根完成的週棒）；跟上面日線報價的日期不是同一天。');
          var r679 = of(ALL.tw00679b, 'risk');
          same(p, '5 年不夠', r679.state.key + '／' + r679.state.word + '／' + r679.state.because, 'na／資料不足／資料不足：只有 40 週（至少要 234 週）');
          same(p, '5 年不夠時那一格照實寫', r679.facts[1].v + '／' + r679.facts[1].plain, '資料不足／資料不足');
          ['gold_twd', 'gold_cny', 'gold_bar'].forEach(function (id) {
            var s = of(ALL[id], 'risk').state;
            same(p, id + ' 沒有週線長歷史', s.key + '／' + s.because, 'na／沒有週線長歷史，算不出 1 年與 5 年的波動');
          });
          var gone = of(CA.aspects(ASSETS.tw00646, ctx(null, { risk: null })), 'risk').state;
          same(p, 'risk.json 讀不到', gone.key + '／' + gone.word + '／' + gone.because, 'error／暫時讀不到／分析資料暫時讀不到');
        });

        check('cost_compares_spreads_to_their_own_median', function (p) {
          /* 對照組：人民幣那一本拿到台幣那一本的價差、或一成的門檻改壞 → 這一條會紅。 */
          var twd = of(ALL.gold_twd, 'cost'), cny = of(ALL.gold_cny, 'cost');
          same(p, '台幣存摺 1.0 對 1.0', twd.state.key + '／' + twd.state.word, 'mid／正常');
          same(p, '台幣存摺這次的數字', twd.state.because, '存摺價差 1.00%，自己 264 天的中位數 1.00% → 正常');
          same(p, '台幣存摺的規則', twd.state.rule, '規則：比自己的中位數（264 天）低一成以上算便宜、高一成以上算偏貴，其餘算正常');
          same(p, '人民幣存摺 1.2 對 1.0', cny.state.key + '／' + cny.state.word, 'high／偏貴');
          same(p, '人民幣存摺的白話用人民幣', cny.facts[0].plain, '銀行掛的兩個價格差 1.20%：今天存進 100 人民幣的黃金、馬上再換回現金，大約會少 1.20 人民幣。');
          same(p, '台幣存摺的白話用元', twd.facts[0].plain, '銀行掛的兩個價格差 1.00%：今天存進 100 元的黃金、馬上再換回現金，大約會少 1.00 元。');
          same(p, '跟平常比', cny.facts[1].plain, '比自己平常的水準（中位數 1.00%）高 20%。');
          var cheap = clone(COST); cheap.goldSpread.latest.spreadPct = 0.89;
          same(p, '0.89 倍', of(CA.aspects(ASSETS.gold_twd, ctx(null, { cost: cheap })), 'cost').state.word, '便宜');

          same(p, '更新失敗的標的照 JSON', trendOf(TR({ through: '2026-10-28' }), null, asset('t', 'bot_gold', { status: 'error', price: null })).state.key, 'high');
        });

        check('trend_bar_and_every_card_get_a_chip', function (p) {
          /* 對照組：面向順序少了趨勢 → 這一條會紅。 */
          var d = box(CA.strip(ASSETS.gold_bar, ALL.gold_bar));
          var chip = d.querySelector('button.asp[data-aspect="trend"]');
          if (!chip || chip.getAttribute('data-state') !== 'na') p.push('條塊卡上要畫趨勢的資料不足圖示');
          ['fx_usd', 'gold_twd', 'tw00679b', 'twii'].forEach(function (id) {
            same(p, id + ' 照 JSON', of(ALL[id], 'trend').state.key, RISK.trend[id] ? 'high' : 'na');
          });
        });

        check('trend_because_has_one_decimal_signs_and_the_data_date', function (p) {
          /* 對照組：because 不寫「不含息」或日期、或天數寫死不看 JSON → 這一條會紅。 */
          var FORMAT = /^現價(比 \d+ 日均線(高|低) \d+\.\d%|跟 \d+ 日均線差不到 0\.1%)、近 12 個月 (\+\d+\.\d%|-\d+\.\d%|0\.0%)（不含息，資料到 \d{4}-\d{2}-\d{2}） → (向上|持平|向下)$/;
          var seen = {};
          [[99.005, true, 100], [-49.87, false, -50], [5.04, true, -0.04], [-0.04, false, 0.04], [0.01, true, 0.01], [-12.34, false, -56.78]].forEach(function (c) {
            var a = trendOf(TR({ dist200Pct: c[0], above: c[1], ret12mPct: c[2] }));
            seen[a.state.key] = true;
            if (!FORMAT.test(a.state.because)) p.push('格式不對：' + a.state.because);
            if (a.state.because.indexOf('-0.0%') >= 0) p.push('不印 -0.0%：' + a.state.because);
          });
          same(p, '三態都測到', Object.keys(seen).sort().join('、'), 'high、low、mid');
          var other = trendOf(TR({ maDays: 150, retDays: 120 }));
          same(p, '天數照 JSON（均線）', other.state.because.indexOf('比 150 日均線') === 2, true);
          same(p, '天數照 JSON（規則）', other.state.rule.indexOf('現價高於 150 日均線') > 0, true);
          same(p, '天數照 JSON（細節）', other.facts[0].k + '｜' + other.facts[1].plain.slice(0, 12), '150 日均線｜跟 120 個交易日前（');
        });

        check('trend_rule_starts_with_rule_and_is_printed_everywhere', function (p) {
          same(p, '規則句', P.trendRule(200), RULE_TEXT);
          if (P.ASPECTS.trend.rule.indexOf('規則：') !== 0) p.push('面向的預設規則句要以「規則：」開頭');
          same(p, '面向用色點', P.ASPECTS.trend.icon, 'dot');
          [TR(), T_DOWN, T_MIXED, TR({ dist200Pct: null, reason: SHORT199 })].forEach(function (t, i) {
            var a = trendOf(t), d = box(CA.detail(a));
            same(p, i + ' 狀態的規則', a.state.rule, RULE_TEXT);
            same(p, i + ' 細節印出規則', d.querySelector('.asp-rule') && d.querySelector('.asp-rule').textContent, RULE_TEXT);
            var c = box(CA.cell(a)).querySelector('.asp-cell');
            same(p, i + ' 總覽表那一格', c.getAttribute('data-state'), a.state.key);
            if (!c.querySelector('.asp-icon svg')) p.push(i + '：總覽表那一格沒有圖示');
          });
        });

        check('trend_terms_are_in_the_glossary_and_rsi_is_only_a_description', function (p) {
          /* 對照組：名詞解釋少了「200 日均線」、或 RSI 少了定位那一句 → 這一條會紅。 */
          ['200 日均線', '12 個月報酬'].forEach(function (t) {
            var def = window.Glossary.define(t);
            if (!def || def.length < 8) p.push('名詞「' + t + '」沒有解釋');
          });
          if ((window.Glossary.define('12 個月報酬') || '').indexOf('不含配息') < 0) p.push('12 個月報酬要寫不含配息');
          if ((window.Glossary.define('RSI') || '').indexOf('本站只拿它描述最近漲跌，不作為判斷依據') < 0) p.push('RSI 要寫清楚它在本站的定位');
          var d = box(CA.detail(trendOf(TR())));
          var terms = Array.prototype.map.call(d.querySelectorAll('button.term'), function (b) { return b.getAttribute('data-term'); });
          same(p, '細節裡的名詞可以點', terms.join('｜'), '200 日均線｜12 個月報酬');
          window.Glossary.wire(d);
          d.querySelector('button.term').click();
          if (!d.querySelector('.term-def') || d.querySelector('.term-def').textContent.indexOf('200 日均線：') !== 0) p.push('點名詞沒有展開解釋');
        });

        check('trend_sentences_say_insufficient_instead_of_nothing', function (p) {
          ['trendMa', 'trendReturn'].forEach(function (k) {
            if (P.KINDS.indexOf(k) < 0) p.push('白話模板清單（Plain.KINDS）裡沒有 ' + k);
            [undefined, {}, { pct: null, days: 200 }, { pct: 'abc', days: 200 }, { pct: NaN, days: 200 }, { pct: 1 }].forEach(function (data) {
              same(p, k + ' 遇到 ' + JSON.stringify(data), P.sentence(k, data), '資料不足');
            });
          });
          same(p, '沒有起算日就不寫括號', P.sentence('trendReturn', { pct: -3.21, days: 252 }), '跟 252 個交易日前的收盤價比，價格跌了 3.2%；只算價格，不含配息。');
          same(p, '很大的數字', P.sentence('trendMa', { pct: 1234.56, days: 200 }), '現價比最近 200 個交易日的平均收盤價高 1,234.6%。');
        });

        check('trend_has_no_trading_words_and_no_counting', function (p) {
          /* 對照組：趨勢的字眼帶方向的交易用語、或加總 → 這一條會紅。 */
          var text = [P.trendRule(200), P.ASPECTS.trend.rule, window.Glossary.define('200 日均線'), window.Glossary.define('12 個月報酬'), window.Glossary.define('RSI')].join('\n');
          [TR(), T_DOWN, T_MIXED, T_EVEN, TR({ dist200Pct: null, reason: SHORT199 })].forEach(function (t) {
            var a = trendOf(t);
            text += '\n' + box(CA.strip(asset('t', 'yahoo'), [a]) + CA.detail(a) + CA.cell(a)).textContent;
            if (VOCAB.trend.indexOf(a.state.word) < 0) p.push('不在詞表裡的狀態詞「' + a.state.word + '」');
          });
          BANNED.forEach(function (w) { if (text.indexOf(w) >= 0) p.push('出現「' + w + '」'); });
          if (COUNTING.test(text)) p.push('出現面向計數：' + COUNTING.exec(text)[0]);
          ['count', 'total', 'summary', 'score', 'tally', 'countStates', 'sumStates'].forEach(function (k) {
            if (typeof P[k] !== 'undefined' || typeof CA[k] !== 'undefined') p.push('不該有加總用的函式：' + k);
          });
        });
      }
      document.getElementById('result').textContent = JSON.stringify({ loaded: loaded, total: results.length, results: results });
    })();
  </script>
